name: AI News

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-news.yml'
      - 'scripts/fetch-ai-news.mjs'
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
      force:
        description: '是否强制覆盖已存在文件'
        required: true
        default: false
        type: boolean

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache font sources
        uses: actions/cache@v4
        with:
          path: .font-sources
          key: font-sources-v1-misans-2025-07-14-sarasa-1.0.41

      - name: Generate daily news
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch' && inputs.mode == 'daily' || github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FORCE_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: node scripts/fetch-ai-news.mjs --daily ${{ env.FORCE_REGENERATE == 'true' && '--force' || '' }}

      - name: Generate weekly summary
        if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * 0' || github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-v4-flash
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          AZURE_TRANSLATOR_ENDPOINT: ${{ secrets.AZURE_TRANSLATOR_ENDPOINT }}
          FORCE_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
        run: node scripts/fetch-ai-news.mjs --weekly ${{ env.FORCE_REGENERATE == 'true' && '--force' || '' }}

      - name: Detect generated content changes
        id: content-changes
        run: |
          if [[ -z "$(git status --short -- src/content/docs/ai-news/ src/data/ai-news-daily/)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install font archive tools
        if: steps.content-changes.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools python3-venv

      - name: Update font subsets
        if: steps.content-changes.outputs.changed == 'true'
        run: npm run fonts:update

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/ai-news/ src/data/ai-news-daily/ public/fonts/ scripts/font-subset-codepoints.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(ai-news): auto-generate $(date -u +%Y-%m-%d)"
          git push
