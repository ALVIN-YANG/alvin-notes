name: AI 公司目录每月同步

on:
  schedule:
    # 每月 1 日北京时间 08:30；只同步公开名单，不调用模型。
    - cron: '30 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ai-companies-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: .font-sources
          key: font-sources-v1-misans-2025-07-14-sarasa-1.0.41
      - name: 安装依赖与检查目录及失败恢复
        run: npm ci && python -m pip install pypdf==6.10.0 && node --test tests/company-directory.test.mjs tests/company-observer.test.mjs
      - name: 同步名单与备案来源
        id: sync
        continue-on-error: true
        run: npm run companies:sync
      - name: 校验目录
        run: npm run companies:check
      - name: 安装字体工具
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools python3-venv
      - name: 构建并发布目录
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/companies-sync"
          mkdir -p "$snapshot"
          cp src/data/companies/{directory,sync-state}.json "$snapshot/"
          base_sha=$(git rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$base_sha" origin/main -- src/data/companies/ src/lib/company-directory.mjs scripts/sync-ai-companies.mjs; then
              echo '目录或同步规则在运行期间发生修改，请重新运行。' >&2
              exit 1
            fi
            git reset --hard origin/main
            cp "$snapshot/"*.json src/data/companies/
            npm run companies:check
            npm run fonts:update
            npm run build
            git add src/data/companies/{directory,sync-state}.json public/fonts/misans/ public/fonts/sarasa/ scripts/font-subset-codepoints.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "同步 AI 公司目录与公开来源 $(date -u +%Y-%m-%d)"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo '发布失败：主分支持续变化，请重新运行。' >&2
          exit 1
      - name: 报告来源失败
        if: steps.sync.outcome == 'failure'
        run: |
          echo '部分来源同步失败，已保留其上次成功数据和日期；其他成功来源照常更新。'
          exit 1
