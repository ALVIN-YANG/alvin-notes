<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">Mem0 在 Agent 应用中的位置：add 保存，search 找回，当前偏好由应用判断</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97745"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1440" height="980" fill="#fbfaf6"/>

  <text data-svg-label="" class="title" x="60" y="68">Mem0 在 Agent 应用中的位置</text>
  <text data-svg-label="" class="sub" x="60" y="112">基于官方 README 与 2026 年 4 月新算法说明 · 应用仍负责业务当前状态</text>

  <rect id="node-1" data-svg-box="" class="box" x="60" y="190" width="280" height="250" fill="#e7edf3" stroke="#b9c6d4"/>
  <text data-svg-container="node-1" class="head" x="200" y="234" text-anchor="middle">用户与对话</text>
  <text data-svg-container="node-1" class="body" x="200" y="300" text-anchor="middle">用户提问</text>
  <text data-svg-container="node-1" class="body" x="200" y="356" text-anchor="middle">助手回答</text>
  <text data-svg-container="node-1" class="body" x="200" y="412" text-anchor="middle">历史消息</text>

  <line x1="340" y1="315" x2="406" y2="315" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect id="node-2" data-svg-box="" class="box" x="410" y="190" width="360" height="250" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-2" class="head" x="590" y="234" text-anchor="middle">你的 Agent 应用</text>
  <text data-svg-container="node-2" class="body" x="590" y="300" text-anchor="middle">组装提示词</text>
  <text data-svg-container="node-2" class="body" x="590" y="356" text-anchor="middle">调用主模型</text>
  <text data-svg-container="node-2" class="body" x="590" y="412" text-anchor="middle">判断当前偏好</text>

  <line x1="770" y1="315" x2="826" y2="315" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect id="node-3" data-svg-box="" class="box" x="830" y="190" width="550" height="250" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text data-svg-container="node-3" class="head" x="1105" y="234" text-anchor="middle">主模型与工具</text>
  <text data-svg-container="node-3" class="body" x="1105" y="300" text-anchor="middle">LLM API（外部）</text>
  <text data-svg-container="node-3" class="body" x="1105" y="356" text-anchor="middle">embedding 向量服务</text>
  <text data-svg-container="node-3" class="body" x="1105" y="412" text-anchor="middle">工具执行</text>

  <line x1="560" y1="444" x2="560" y2="536" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <text data-svg-label="" x="380" y="500" font-size="24" fill="#6b6f76">对话与问题</text>
  <line x1="660" y1="536" x2="660" y2="448" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <text data-svg-label="" x="700" y="500" font-size="24" fill="#6b6f76">相关记忆</text>
  <line x1="1105" y1="444" x2="1105" y2="536" stroke="#8a8f98" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrowGray)"/>
  <text data-svg-label="" x="1140" y="505" font-size="24" fill="#6b6f76">提取也调用模型</text>

  <rect id="node-4" data-svg-box="" x="60" y="540" width="1320" height="330" rx="14" fill="none" stroke="#d97745" stroke-width="2.5" stroke-dasharray="10 8"/>
  <text data-svg-container="node-4" x="720" y="584" text-anchor="middle" font-size="27" font-weight="700" fill="#d97745">Mem0 记忆层 · add 保存，search 找回</text>

  <rect id="node-5" data-svg-box="" class="box" x="100" y="620" width="360" height="240" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-5" class="head" x="280" y="664" text-anchor="middle">add：写入记忆</text>
  <text data-svg-container="node-5" class="body" x="280" y="720" text-anchor="middle">单次 LLM 提取事实</text>
  <text data-svg-container="node-5" class="body" x="280" y="770" text-anchor="middle">ADD-only 只新增</text>
  <text data-svg-container="node-5" class="body" x="280" y="820" text-anchor="middle">实体链接</text>

  <line x1="460" y1="740" x2="536" y2="740" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect id="node-6" data-svg-box="" class="box" x="540" y="620" width="360" height="240" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-6" class="head" x="720" y="664" text-anchor="middle">记忆存储</text>
  <text data-svg-container="node-6" class="body" x="720" y="720" text-anchor="middle">记忆文本与向量</text>
  <text data-svg-container="node-6" class="body" x="720" y="770" text-anchor="middle">元数据 user_id 等</text>
  <text data-svg-container="node-6" class="body" x="720" y="820" text-anchor="middle">实体关联</text>

  <line x1="900" y1="740" x2="976" y2="740" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect id="node-7" data-svg-box="" class="box" x="980" y="620" width="360" height="240" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-7" class="head" x="1160" y="664" text-anchor="middle">search：检索记忆</text>
  <text data-svg-container="node-7" class="body" x="1160" y="720" text-anchor="middle">语义 + BM25 + 实体</text>
  <text data-svg-container="node-7" class="body" x="1160" y="770" text-anchor="middle">时间推理排序</text>
  <text data-svg-container="node-7" class="body" x="1160" y="820" text-anchor="middle">返回 top_k 条</text>

  <text data-svg-label="" class="sub" x="60" y="930">注：Mem0 保存并找回记忆记录；哪条偏好现在生效，仍由应用结合业务规则判断。</text>
</svg>
