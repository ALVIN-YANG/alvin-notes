<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">宿主机内 IPC 的两条数据通路</title>
  <desc id="desc">管道、消息队列和 Socket 通过内核转发数据；共享内存让两个进程读写同一批物理页，但需要额外的同步和通知。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#5268d8"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#14967f"/></marker>
  </defs>
  <rect width="1200" height="840" rx="24" fill="#f7f8fc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#17223b">
    <text x="48" y="62" font-size="34" font-weight="700" data-svg-label="">数据怎样从进程 A 到进程 B？</text>
    <text x="48" y="100" font-size="20" fill="#667085" data-svg-label="">先选数据通路，再补同步、权限和恢复</text>

    <rect id="kernel-panel" data-svg-box="" x="40" y="132" width="1120" height="300" rx="22" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <text x="70" y="176" font-size="25" font-weight="700" fill="#4256c6" data-svg-container="kernel-panel">① 内核转发：通用、省心</text>
    <text x="70" y="207" font-size="18" fill="#667085" data-svg-container="kernel-panel">例：API 进程调用本机推理 worker</text>

    <rect id="kernel-a" data-svg-box="" x="70" y="252" width="220" height="116" rx="16" fill="#eef1ff"/>
    <text x="180" y="301" text-anchor="middle" font-size="25" font-weight="650" data-svg-container="kernel-a">进程 A</text>
    <text x="180" y="337" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="kernel-a">发送请求</text>

    <rect id="kernel-node" data-svg-box="" x="490" y="238" width="220" height="140" rx="16" fill="#5268d8"/>
    <text x="600" y="285" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff" data-svg-container="kernel-node">内核缓冲区</text>
    <text x="600" y="322" text-anchor="middle" font-size="18" fill="#e8ebff" data-svg-container="kernel-node">暂存并转发数据</text>
    <text x="600" y="352" text-anchor="middle" font-size="16" fill="#e8ebff" data-svg-container="kernel-node">有容量上限</text>

    <rect id="kernel-b" data-svg-box="" x="910" y="252" width="220" height="116" rx="16" fill="#eef1ff"/>
    <text x="1020" y="301" text-anchor="middle" font-size="25" font-weight="650" data-svg-container="kernel-b">进程 B</text>
    <text x="1020" y="337" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="kernel-b">读取请求</text>

    <path d="M302 310H474" fill="none" stroke="#5268d8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <path d="M722 310H894" fill="none" stroke="#5268d8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
    <text x="388" y="289" text-anchor="middle" font-size="17" fill="#4256c6" data-svg-container="kernel-panel">write / send</text>
    <text x="808" y="289" text-anchor="middle" font-size="17" fill="#4256c6" data-svg-container="kernel-panel">read / recv</text>
    <text x="600" y="405" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="kernel-panel">管道 · 消息队列 · Unix Socket · TCP</text>

    <rect id="shared-panel" data-svg-box="" x="40" y="452" width="1120" height="330" rx="22" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <text x="70" y="496" font-size="25" font-weight="700" fill="#117d6b" data-svg-container="shared-panel">② 共享内存：数据路径短，协议更复杂</text>
    <text x="70" y="527" font-size="18" fill="#667085" data-svg-container="shared-panel">例：视频采集进程向推理进程传递连续帧</text>

    <rect id="shared-a" data-svg-box="" x="70" y="572" width="220" height="116" rx="16" fill="#e9f7f3"/>
    <text x="180" y="621" text-anchor="middle" font-size="25" font-weight="650" data-svg-container="shared-a">进程 A</text>
    <text x="180" y="657" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="shared-a">写入帧槽位</text>

    <rect id="shared-node" data-svg-box="" x="460" y="552" width="280" height="138" rx="16" fill="#14967f"/>
    <text x="600" y="601" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff" data-svg-container="shared-node">同一批物理页</text>
    <text x="600" y="638" text-anchor="middle" font-size="18" fill="#e6fff8" data-svg-container="shared-node">双方 mmap 后直接读写</text>
    <text x="600" y="667" text-anchor="middle" font-size="16" fill="#e6fff8" data-svg-container="shared-node">用偏移，不用进程内指针</text>

    <rect id="shared-b" data-svg-box="" x="910" y="572" width="220" height="116" rx="16" fill="#e9f7f3"/>
    <text x="1020" y="621" text-anchor="middle" font-size="25" font-weight="650" data-svg-container="shared-b">进程 B</text>
    <text x="1020" y="657" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="shared-b">读取帧槽位</text>

    <path d="M302 630H444" fill="none" stroke="#14967f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
    <path d="M752 630H894" fill="none" stroke="#14967f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-teal)"/>
    <text x="373" y="609" text-anchor="middle" font-size="17" fill="#117d6b" data-svg-container="shared-panel">直接写入</text>
    <text x="823" y="609" text-anchor="middle" font-size="17" fill="#117d6b" data-svg-container="shared-panel">直接读取</text>

    <rect id="sync-node" data-svg-box="" x="770" y="702" width="360" height="56" rx="12" fill="#fff4e8"/>
    <text x="950" y="737" text-anchor="middle" font-size="18" fill="#a45a17" data-svg-container="sync-node">信号量 / eventfd：同步与唤醒</text>
    <text x="70" y="746" font-size="18" fill="#a45a17" data-svg-container="shared-panel">必须有：有界队列 · 内存序 · 崩溃恢复</text>
  </g>
  <text x="600" y="818" text-anchor="middle" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#667085" data-svg-label="">共享内存减少逐次复制，不等于整条处理链零拷贝</text>
</svg>
