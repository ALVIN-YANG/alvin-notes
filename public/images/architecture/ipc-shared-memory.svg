<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">共享内存映射</title><desc id="desc">进程 A 和 B 的不同虚拟地址映射到同一批物理页，另需同步和唤醒。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#14967f"/></marker></defs>
  <rect width="1000" height="650" rx="24" fill="#f7f8fc"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#17223b">
    <text x="40" y="58" font-size="32" font-weight="700" data-svg-label="">共享内存：虚拟地址不同，物理页相同</text>
    <rect id="va" data-svg-box="" data-svg-padding="12" x="55" y="120" width="240" height="310" rx="20" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <text x="175" y="163" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="va">进程 A</text><text x="175" y="197" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="va">虚拟地址空间</text>
    <rect x="90" y="225" width="170" height="48" rx="9" fill="#eef1ff"/><rect x="90" y="287" width="170" height="48" rx="9" fill="#eef1ff"/><rect id="va-map" data-svg-box="" data-svg-padding="12" x="90" y="349" width="170" height="48" rx="9" fill="#14967f"/>
    <text x="175" y="381" text-anchor="middle" font-size="16" fill="#fff" data-svg-container="va-map">映射区</text>
    <rect id="vb" data-svg-box="" data-svg-padding="12" x="705" y="120" width="240" height="310" rx="20" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <text x="825" y="163" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="vb">进程 B</text><text x="825" y="197" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="vb">虚拟地址空间</text>
    <rect x="740" y="225" width="170" height="48" rx="9" fill="#e9f7f3"/><rect x="740" y="287" width="170" height="48" rx="9" fill="#e9f7f3"/><rect id="vb-map" data-svg-box="" data-svg-padding="12" x="740" y="349" width="170" height="48" rx="9" fill="#14967f"/>
    <text x="825" y="381" text-anchor="middle" font-size="16" fill="#fff" data-svg-container="vb-map">映射区</text>
    <rect id="pages" data-svg-box="" data-svg-padding="12" x="370" y="225" width="260" height="172" rx="18" fill="#14967f"/>
    <text x="500" y="273" text-anchor="middle" font-size="25" font-weight="700" fill="#fff" data-svg-container="pages">同一批物理页</text>
    <path d="M405 310h190M405 342h190" stroke="#9be1d2" stroke-width="12" stroke-linecap="round"/>
    <text x="500" y="380" text-anchor="middle" font-size="17" fill="#e6fff8" data-svg-container="pages">读写不必逐次复制</text>
    <rect id="shmnote" data-svg-box="" data-svg-padding="12" x="55" y="490" width="890" height="110" rx="18" fill="#fff4e8"/>
    <text x="500" y="534" text-anchor="middle" font-size="22" font-weight="700" fill="#a45a17" data-svg-container="shmnote">共享内存 ≠ 自动同步</text><text x="500" y="572" text-anchor="middle" font-size="19" fill="#a45a17" data-svg-container="shmnote">用偏移，不用指针；另配信号量 / eventfd</text>
  </g>
  <g fill="none" stroke="#14967f" stroke-width="3" marker-end="url(#a)"><path d="M295 373H354"/><path d="M705 373H646"/></g>
  <text x="325" y="350" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" fill="#117d6b" data-svg-label="">mmap</text><text x="675" y="350" text-anchor="middle" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="18" fill="#117d6b" data-svg-label="">mmap</text>
</svg>
