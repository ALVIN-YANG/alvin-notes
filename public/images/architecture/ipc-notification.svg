<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">信号与 eventfd</title><desc id="desc">信号和 eventfd 通过内核传递通知，eventfd 使用 64 位计数器并可接入事件循环。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#d88a37"/></marker></defs>
  <rect width="1000" height="520" rx="24" fill="#f7f8fc"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#17223b">
    <text x="40" y="58" font-size="32" font-weight="700" data-svg-label="">通知：告诉对方“有事发生”</text>
    <rect id="na" data-svg-box="" x="55" y="175" width="200" height="110" rx="16" fill="#fff4e8"/><text x="155" y="238" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="na">进程 A</text>
    <rect id="counter" data-svg-box="" x="390" y="155" width="220" height="150" rx="18" fill="#d88a37"/>
    <path d="M432 185l-24 42h25l-10 42 45-55h-27l15-29Z" fill="#fff"/>
    <text x="525" y="205" text-anchor="middle" font-size="23" font-weight="700" fill="#fff" data-svg-container="counter">内核通知</text><text x="510" y="244" text-anchor="middle" font-size="18" fill="#fff4e8" data-svg-container="counter">信号 / eventfd</text><text x="510" y="275" text-anchor="middle" font-size="16" fill="#fff4e8" data-svg-container="counter">事件或计数</text>
    <rect id="nb" data-svg-box="" x="745" y="175" width="200" height="110" rx="16" fill="#fff4e8"/><text x="845" y="238" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="nb">进程 B</text>
    <rect id="sig" data-svg-box="" x="55" y="355" width="410" height="100" rx="16" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/><text x="260" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#a45a17" data-svg-container="sig">信号</text><text x="260" y="431" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="sig">标准信号同类可合并</text>
    <rect id="efd" data-svg-box="" x="535" y="355" width="410" height="100" rx="16" fill="#ffffff" stroke="#ead8bf" stroke-width="2"/><text x="740" y="397" text-anchor="middle" font-size="22" font-weight="700" fill="#a45a17" data-svg-container="efd">eventfd</text><text x="740" y="431" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="efd">64 位计数，可接入 epoll</text>
  </g>
  <g fill="none" stroke="#d88a37" stroke-width="3" marker-end="url(#a)"><path d="M255 230H374"/><path d="M610 230H729"/></g>
</svg>
