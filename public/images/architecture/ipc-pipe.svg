<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">匿名管道与 FIFO</title><desc id="desc">匿名管道通过继承文件描述符连接 ps 和 grep，FIFO 通过文件系统路径连接独立进程。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5268d8"/></marker></defs>
  <rect width="1000" height="600" rx="24" fill="#f7f8fc"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#17223b">
    <text x="40" y="55" font-size="32" font-weight="700" data-svg-label="">管道：字节从写端流向读端</text>
    <rect id="ap" data-svg-box="" data-svg-padding="12" x="40" y="90" width="920" height="220" rx="22" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <text x="65" y="130" font-size="23" font-weight="700" fill="#4256c6" data-svg-container="ap">匿名管道：共同祖先创建，进程继承 fd</text>
    <rect id="ps" data-svg-box="" data-svg-padding="12" x="75" y="175" width="180" height="95" rx="15" fill="#eef1ff"/>
    <text x="165" y="215" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="ps">ps</text><text x="165" y="247" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="ps">fd[1] 写端</text>
    <rect id="pb" data-svg-box="" data-svg-padding="12" x="390" y="175" width="220" height="95" rx="15" fill="#5268d8"/>
    <text x="500" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" data-svg-container="pb">内核管道</text><text x="500" y="247" text-anchor="middle" font-size="18" fill="#e8ebff" data-svg-container="pb">无消息边界</text>
    <rect id="grep" data-svg-box="" data-svg-padding="12" x="745" y="175" width="180" height="95" rx="15" fill="#eef1ff"/>
    <text x="835" y="215" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="grep">grep</text><text x="835" y="247" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="grep">fd[0] 读端</text>
    <rect id="fp" data-svg-box="" data-svg-padding="12" x="40" y="335" width="920" height="220" rx="22" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <text x="65" y="375" font-size="23" font-weight="700" fill="#4256c6" data-svg-container="fp">FIFO：无亲缘进程按同一路径打开</text>
    <rect id="fa" data-svg-box="" data-svg-padding="12" x="75" y="420" width="180" height="95" rx="15" fill="#eef1ff"/><text x="165" y="475" text-anchor="middle" font-size="24" font-weight="700" data-svg-container="fa">进程 A</text>
    <rect id="fn" data-svg-box="" data-svg-padding="12" x="365" y="420" width="270" height="95" rx="15" fill="#eef1ff" stroke="#91a0ed" stroke-width="2"/>
    <text x="500" y="459" text-anchor="middle" font-size="22" font-weight="700" fill="#4256c6" data-svg-container="fn">/tmp/demo.fifo</text><text x="500" y="491" text-anchor="middle" font-size="17" fill="#667085" data-svg-container="fn">路径只负责命名</text>
    <rect id="fb" data-svg-box="" data-svg-padding="12" x="745" y="420" width="180" height="95" rx="15" fill="#eef1ff"/><text x="835" y="475" text-anchor="middle" font-size="24" font-weight="700" data-svg-container="fb">进程 B</text>
  </g>
  <g fill="none" stroke="#5268d8" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"><path d="M255 222H374"/><path d="M610 222H729"/><path d="M255 467H349"/><path d="M635 467H729"/></g>
  <g fill="#91a0ed"><circle cx="440" cy="222" r="6"/><circle cx="465" cy="222" r="6"/><circle cx="490" cy="222" r="6"/></g>
</svg>
