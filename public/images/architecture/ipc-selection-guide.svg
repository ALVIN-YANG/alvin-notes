<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc">
  <title id="title">宿主机内 IPC 场景选型</title>
  <desc id="desc">按 Shell 命令链、独立进程单向流、本机请求响应、小消息、大帧、控制通知、持久化和跨机器八个场景选择 IPC 方案。</desc>
  <rect width="1200" height="1230" rx="24" fill="#f7f8fc"/>
  <g font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#17223b">
    <text x="48" y="62" font-size="34" font-weight="700" data-svg-label="">按场景选，不按“最快”排名</text>
    <text x="48" y="100" font-size="20" fill="#667085" data-svg-label="">左边是问题，右边是推荐起点与必须接受的代价</text>

    <rect id="row-pipe" data-svg-box="" x="40" y="132" width="1120" height="108" rx="18" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <rect x="40" y="132" width="8" height="108" rx="4" fill="#5268d8"/>
    <text x="72" y="175" font-size="25" font-weight="650" data-svg-container="row-pipe">Shell：ps | grep</text>
    <text x="430" y="174" font-size="25" font-weight="700" fill="#4256c6" data-svg-container="row-pipe">匿名管道</text>
    <text x="430" y="210" font-size="19" fill="#667085" data-svg-container="row-pipe">单向字节流；双向要两条，消息边界自己约定</text>

    <rect id="row-fifo" data-svg-box="" x="40" y="256" width="1120" height="108" rx="18" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <rect x="40" y="256" width="8" height="108" rx="4" fill="#5268d8"/>
    <text x="72" y="299" font-size="25" font-weight="650" data-svg-container="row-fifo">独立进程单向流</text>
    <text x="430" y="298" font-size="25" font-weight="700" fill="#4256c6" data-svg-container="row-fifo">FIFO 命名管道</text>
    <text x="430" y="334" font-size="19" fill="#667085" data-svg-container="row-fifo">按路径连接；处理打开顺序、权限和残留路径</text>

    <rect id="row-uds" data-svg-box="" x="40" y="380" width="1120" height="108" rx="18" fill="#eef1ff" stroke="#91a0ed" stroke-width="2"/>
    <rect x="40" y="380" width="8" height="108" rx="4" fill="#4256c6"/>
    <text x="72" y="423" font-size="25" font-weight="650" data-svg-container="row-uds">API → 本机 worker</text>
    <text x="430" y="422" font-size="25" font-weight="700" fill="#4256c6" data-svg-container="row-uds">Unix Domain Socket · 默认</text>
    <text x="430" y="458" font-size="19" fill="#526079" data-svg-container="row-uds">双向、多客户端、可传 fd；自定义分帧、超时与重试</text>

    <rect id="row-mq" data-svg-box="" x="40" y="504" width="1120" height="108" rx="18" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <rect x="40" y="504" width="8" height="108" rx="4" fill="#7b61b5"/>
    <text x="72" y="547" font-size="25" font-weight="650" data-svg-container="row-mq">小消息 · 类型 / 优先级</text>
    <text x="430" y="546" font-size="25" font-weight="700" fill="#6d4ca7" data-svg-container="row-mq">内核消息队列</text>
    <text x="430" y="582" font-size="19" fill="#667085" data-svg-container="row-mq">保留消息边界；容量有限，不等于 Kafka，也不落盘</text>

    <rect id="row-shm" data-svg-box="" x="40" y="628" width="1120" height="108" rx="18" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <rect x="40" y="628" width="8" height="108" rx="4" fill="#14967f"/>
    <text x="72" y="671" font-size="25" font-weight="650" data-svg-container="row-shm">视频帧 → 推理进程</text>
    <text x="430" y="670" font-size="25" font-weight="700" fill="#117d6b" data-svg-container="row-shm">共享内存 + eventfd</text>
    <text x="430" y="706" font-size="19" fill="#667085" data-svg-container="row-shm">偏移代替指针；有界队列，同步、唤醒与崩溃恢复</text>

    <rect id="row-signal" data-svg-box="" x="40" y="752" width="1120" height="108" rx="18" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <rect x="40" y="752" width="8" height="108" rx="4" fill="#d88a37"/>
    <text x="72" y="795" font-size="25" font-weight="650" data-svg-container="row-signal">退出 · 重载 · 唤醒</text>
    <text x="430" y="794" font-size="25" font-weight="700" fill="#a45a17" data-svg-container="row-signal">信号 / eventfd</text>
    <text x="430" y="830" font-size="19" fill="#667085" data-svg-container="row-signal">只做控制通知；标准信号不排队，不传业务对象</text>

    <rect id="row-file" data-svg-box="" x="40" y="876" width="1120" height="108" rx="18" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <rect x="40" y="876" width="8" height="108" rx="4" fill="#617185"/>
    <text x="72" y="919" font-size="25" font-weight="650" data-svg-container="row-file">产物交接 · 持久化</text>
    <text x="430" y="918" font-size="25" font-weight="700" fill="#4b5f75" data-svg-container="row-file">文件 / 数据库</text>
    <text x="430" y="954" font-size="19" fill="#667085" data-svg-container="row-file">临时文件 + rename + 通知；可见不等于已落盘</text>

    <rect id="row-tcp" data-svg-box="" x="40" y="1000" width="1120" height="108" rx="18" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <rect x="40" y="1000" width="8" height="108" rx="4" fill="#617185"/>
    <text x="72" y="1043" font-size="25" font-weight="650" data-svg-container="row-tcp">即将跨机器</text>
    <text x="430" y="1042" font-size="25" font-weight="700" fill="#4b5f75" data-svg-container="row-tcp">回环 TCP + RPC</text>
    <text x="430" y="1078" font-size="19" fill="#667085" data-svg-container="row-tcp">复用网络生态；绑定 127.0.0.1 仍需要认证</text>

    <rect id="footer" data-svg-box="" x="40" y="1136" width="1120" height="64" rx="16" fill="#17223b"/>
    <text x="600" y="1176" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff" data-svg-container="footer">所有方案都要定：最大消息 · 背压 · 权限 · 幂等 · 生命周期</text>
  </g>
</svg>
