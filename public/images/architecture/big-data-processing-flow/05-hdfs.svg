<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1090" role="img">
<title>HDFS：把大文件切成可恢复的分布式数据块</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#d97745"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#8a8f98"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24282f}.title{font-size:38px;font-weight:700}.subtitle{font-size:23px;fill:#6b6f76}.head{font-size:26px;font-weight:650}.body{font-size:23px}.small{font-size:20px}.note{font-size:22px;fill:#6b6f76}.accent{fill:#b35c2e;font-weight:650}.white{fill:#fff}.arrow{stroke:#d97745;stroke-width:3;fill:none;marker-end:url(#arrow)}.gray-arrow{stroke:#8a8f98;stroke-width:2.5;fill:none;marker-end:url(#arrow-gray)}.dash{stroke-dasharray:8 6}.group{fill:none;stroke:#e0b48f;stroke-width:2;stroke-dasharray:10 8}</style>
<rect width="1440" height="1090" fill="#fbfaf6"/>
<text x="60" y="68" class="title" data-svg-label="">HDFS：把大文件切成可恢复的分布式数据块</text>
<text x="60" y="112" class="subtitle" data-svg-label="">Hadoop Distributed File System；128 MiB、3 副本是常见默认值，实际均可配置</text>
<rect id="node-1" data-svg-box="" x="60" y="165" width="285" height="140" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="202.5" y="210" class="head" text-anchor="middle" data-svg-container="node-1">订单文件</text>
<text x="202.5" y="247" class="body" text-anchor="middle" data-svg-container="node-1">1.28 TB 故事示例</text>
<text x="202.5" y="281" class="body" text-anchor="middle" data-svg-container="node-1">单机难以承载</text>
<rect id="node-2" data-svg-box="" x="440" y="165" width="235" height="140" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="557.5" y="210" class="head" text-anchor="middle" data-svg-container="node-2">切分为 Block</text>
<text x="557.5" y="247" class="body" text-anchor="middle" data-svg-container="node-2">常见默认 128 MiB</text>
<text x="557.5" y="281" class="body" text-anchor="middle" data-svg-container="node-2">分散到多台机器</text>
<line x1="345" y1="235" x2="425" y2="235" class="arrow"/>
<rect id="node-3" data-svg-box="" x="1040" y="150" width="340" height="180" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="1210.0" y="195" class="head" text-anchor="middle" data-svg-container="node-3">NameNode｜目录</text>
<text x="1210.0" y="232" class="body" text-anchor="middle" data-svg-container="node-3">记录文件、数据块</text>
<text x="1210.0" y="266" class="body" text-anchor="middle" data-svg-container="node-3">与 DataNode 的映射</text>
<text x="1210.0" y="300" class="body" text-anchor="middle" data-svg-container="node-3">读写前先查询位置</text>
<rect id="node-4" data-svg-box="" x="360" y="410" width="290" height="200" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="505.0" y="455" class="head" text-anchor="middle" data-svg-container="node-4">DataNode 1</text>
<text x="505.0" y="492" class="body" text-anchor="middle" data-svg-container="node-4">Block A｜副本 1</text>
<text x="505.0" y="526" class="body" text-anchor="middle" data-svg-container="node-4">Block C｜副本 2</text>
<rect id="node-5" data-svg-box="" x="700" y="410" width="290" height="200" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="845.0" y="455" class="head" text-anchor="middle" data-svg-container="node-5">DataNode 2</text>
<text x="845.0" y="492" class="body" text-anchor="middle" data-svg-container="node-5">Block A｜副本 2</text>
<text x="845.0" y="526" class="body" text-anchor="middle" data-svg-container="node-5">Block B｜副本 1</text>
<rect id="node-6" data-svg-box="" x="1040" y="410" width="290" height="200" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="1185.0" y="455" class="head" text-anchor="middle" data-svg-container="node-6">DataNode 3</text>
<text x="1185.0" y="492" class="body" text-anchor="middle" data-svg-container="node-6">Block B｜副本 2</text>
<text x="1185.0" y="526" class="body" text-anchor="middle" data-svg-container="node-6">Block C｜副本 1</text>
<path d="M 675 305 L 675 350 L 505 350 L 505 395" class="arrow"/>
<path d="M 675 305 L 675 350 L 845 350 L 845 395" class="arrow"/>
<path d="M 675 305 L 675 350 L 1185 350 L 1185 395" class="arrow"/>
<text x="730" y="340" class="note" text-anchor="start" data-svg-label="">分发数据块</text>
<line x1="1210" y1="395" x2="1210" y2="345" class="gray-arrow dash"/>
<text x="1080" y="390" class="note" text-anchor="middle" data-svg-label="">心跳 / BlockReport</text>
<rect id="node-7" data-svg-box="" x="60" y="700" width="285" height="150" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="202.5" y="745" class="head" text-anchor="middle" data-svg-container="node-7">客户端读取</text>
<text x="202.5" y="782" class="body" text-anchor="middle" data-svg-container="node-7">① 问 NameNode</text>
<text x="202.5" y="816" class="body" text-anchor="middle" data-svg-container="node-7">数据块在哪里</text>
<rect id="node-8" data-svg-box="" x="440" y="700" width="420" height="150" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="650.0" y="745" class="head" text-anchor="middle" data-svg-container="node-8">② 直接去 DataNode 读写</text>
<text x="650.0" y="782" class="body" text-anchor="middle" data-svg-container="node-8">无需让 NameNode 传输文件内容</text>
<text x="650.0" y="816" class="body" text-anchor="middle" data-svg-container="node-8">DataNode 故障读其他副本</text>
<rect id="node-9" data-svg-box="" x="960" y="700" width="420" height="150" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="1170.0" y="745" class="head" text-anchor="middle" data-svg-container="node-9">③ 得到完整文件</text>
<text x="1170.0" y="782" class="body" text-anchor="middle" data-svg-container="node-9">分布式细节由 HDFS 屏蔽</text>
<text x="1170.0" y="816" class="body" text-anchor="middle" data-svg-container="node-9">应用通过 API 读写</text>
<line x1="345" y1="775" x2="425" y2="775" class="arrow"/>
<line x1="860" y1="775" x2="945" y2="775" class="arrow"/>
<text x="60" y="930" class="note" text-anchor="start" data-svg-label="">HDFS 像可靠的分布式“裸硬盘”：管文件，不自动提供完整的数据目录与业务治理。</text>
<rect id="node-10" data-svg-box="" x="60" y="970" width="290" height="80" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="205.0" y="1015" class="body" text-anchor="middle" data-svg-container="node-10">数据接入</text>
<rect id="node-11" data-svg-box="" x="390" y="970" width="290" height="80" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="535.0" y="1015" class="body" text-anchor="middle" data-svg-container="node-11">元数据管理</text>
<rect id="node-12" data-svg-box="" x="720" y="970" width="290" height="80" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="865.0" y="1015" class="body" text-anchor="middle" data-svg-container="node-12">数据目录</text>
<rect id="node-13" data-svg-box="" x="1050" y="970" width="290" height="80" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="1195.0" y="1015" class="body" text-anchor="middle" data-svg-container="node-13">细粒度权限</text>
</svg>