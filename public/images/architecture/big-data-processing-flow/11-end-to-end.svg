<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1150" role="img">
<title>一家电商的完整数据链路：八个场景串起来</title>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#d97745"/></marker><marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#8a8f98"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#24282f}.title{font-size:38px;font-weight:700}.subtitle{font-size:23px;fill:#6b6f76}.head{font-size:26px;font-weight:650}.body{font-size:23px}.small{font-size:20px}.note{font-size:22px;fill:#6b6f76}.accent{fill:#b35c2e;font-weight:650}.white{fill:#fff}.arrow{stroke:#d97745;stroke-width:3;fill:none;marker-end:url(#arrow)}.gray-arrow{stroke:#8a8f98;stroke-width:2.5;fill:none;marker-end:url(#arrow-gray)}.dash{stroke-dasharray:8 6}.group{fill:none;stroke:#e0b48f;stroke-width:2;stroke-dasharray:10 8}</style>
<rect width="1440" height="1150" fill="#fbfaf6"/>
<text x="60" y="68" class="title" data-svg-label="">一家电商的完整数据链路：八个场景串起来</text>
<text x="60" y="112" class="subtitle" data-svg-label="">以下时间与数字均为视频故事设定，用来理解处理顺序，不是通用性能承诺</text>
<rect id="node-1" data-svg-box="" x="55" y="150" width="630" height="185" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="370.0" y="195" class="head" text-anchor="middle" data-svg-container="node-1">① 用户下单</text>
<text x="370.0" y="232" class="body" text-anchor="middle" data-svg-container="node-1">订单写入 MySQL</text>
<text x="370.0" y="266" class="body" text-anchor="middle" data-svg-container="node-1">毫秒级完成在线交易</text>
<rect id="node-2" data-svg-box="" x="755" y="150" width="630" height="185" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="1070.0" y="195" class="head" text-anchor="middle" data-svg-container="node-2">② 02:00 离线同步</text>
<text x="1070.0" y="232" class="body" text-anchor="middle" data-svg-container="node-2">ETL 抽取订单、用户、支付</text>
<text x="1070.0" y="266" class="body" text-anchor="middle" data-svg-container="node-2">批量写入数据湖保存</text>
<rect id="node-3" data-svg-box="" x="755" y="375" width="630" height="185" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="1070.0" y="420" class="head" text-anchor="middle" data-svg-container="node-3">③ 03:00 离线加工</text>
<text x="1070.0" y="457" class="body" text-anchor="middle" data-svg-container="node-3">调度 48 个故事任务</text>
<text x="1070.0" y="491" class="body" text-anchor="middle" data-svg-container="node-3">生成标签、指标、订单宽表</text>
<rect id="node-4" data-svg-box="" x="55" y="375" width="630" height="185" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="370.0" y="420" class="head" text-anchor="middle" data-svg-container="node-4">④ 08:00 离线分析</text>
<text x="370.0" y="457" class="body" text-anchor="middle" data-svg-container="node-4">BI 调用销售指标 API</text>
<text x="370.0" y="491" class="body" text-anchor="middle" data-svg-container="node-4">生成销售与留存报表</text>
<rect id="node-5" data-svg-box="" x="55" y="600" width="630" height="185" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="370.0" y="645" class="head" text-anchor="middle" data-svg-container="node-5">⑤ 实时计算</text>
<text x="370.0" y="682" class="body" text-anchor="middle" data-svg-container="node-5">点击、停留、滑动持续入湖</text>
<text x="370.0" y="716" class="body" text-anchor="middle" data-svg-container="node-5">Flink 更新实时画像与销售额</text>
<rect id="node-6" data-svg-box="" x="755" y="600" width="630" height="185" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="1070.0" y="645" class="head" text-anchor="middle" data-svg-container="node-6">⑥ 在线推荐</text>
<text x="1070.0" y="682" class="body" text-anchor="middle" data-svg-container="node-6">用户再次打开 App</text>
<text x="1070.0" y="716" class="body" text-anchor="middle" data-svg-container="node-6">推荐系统调用实时标签 API</text>
<rect id="node-7" data-svg-box="" x="755" y="825" width="630" height="185" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="1070.0" y="870" class="head" text-anchor="middle" data-svg-container="node-7">⑦ 精准营销</text>
<text x="1070.0" y="907" class="body" text-anchor="middle" data-svg-container="node-7">筛选浏览运动鞋未下单用户</text>
<text x="1070.0" y="941" class="body" text-anchor="middle" data-svg-container="node-7">通过标签 API 定向发券</text>
<rect id="node-8" data-svg-box="" x="55" y="825" width="630" height="185" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="370.0" y="870" class="head" text-anchor="middle" data-svg-container="node-8">⑧ 长期挖掘</text>
<text x="370.0" y="907" class="body" text-anchor="middle" data-svg-container="node-8">读取三年交易与行为数据</text>
<text x="370.0" y="941" class="body" text-anchor="middle" data-svg-container="node-8">训练推荐与销售预测模型</text>
<line x1="685" y1="242" x2="740" y2="242" class="arrow"/>
<path d="M 1385 335 L 1385 355 Q 1385 467 1405 467 L 1405 467" class="arrow"/>
<line x1="755" y1="467" x2="700" y2="467" class="arrow"/>
<path d="M 55 560 L 35 560 L 35 692 L 40 692" class="arrow"/>
<line x1="685" y1="692" x2="740" y2="692" class="arrow"/>
<path d="M 1385 785 L 1405 785 L 1405 917 L 1400 917" class="arrow"/>
<line x1="755" y1="917" x2="700" y2="917" class="arrow"/>
<rect id="node-9" data-svg-box="" x="55" y="1040" width="1330" height="75" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="720.0" y="1085" class="body" text-anchor="middle" data-svg-container="node-9">数据库管当下交易｜湖仓保存历史与分析数据｜大数据提炼价值｜数据中台让价值复用</text>
</svg>