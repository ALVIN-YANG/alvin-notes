<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Unix 套接字</title><desc id="desc">多个客户端连接同一个 Unix 套接字地址，与服务进程双向通信，也可以传递文件描述符。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5268d8"/></marker><marker id="b" markerWidth="9" markerHeight="9" refX="2" refY="4.5" orient="auto"><path d="M9 0L0 4.5L9 9Z" fill="#14967f"/></marker></defs>
  <rect width="1000" height="570" rx="24" fill="#f7f8fc"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#17223b">
    <text x="40" y="58" font-size="32" font-weight="700" data-svg-label="">Unix 套接字：本机服务入口</text>
    <rect id="c1" data-svg-box="" data-svg-padding="12" x="55" y="135" width="210" height="100" rx="16" fill="#eef1ff"/><text x="160" y="194" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="c1">客户端 1</text>
    <rect id="c2" data-svg-box="" data-svg-padding="12" x="55" y="345" width="210" height="100" rx="16" fill="#eef1ff"/><text x="160" y="404" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="c2">客户端 2</text>
    <rect id="sock" data-svg-box="" data-svg-padding="12" x="385" y="220" width="230" height="130" rx="20" fill="#5268d8"/>
    <circle cx="430" cy="285" r="20" fill="none" stroke="#fff" stroke-width="4"/><path d="M430 265v40M410 285h40" stroke="#fff" stroke-width="4"/>
    <text x="525" y="271" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" data-svg-container="sock">套接字地址</text><text x="500" y="315" text-anchor="middle" font-size="17" fill="#e8ebff" data-svg-container="sock">/run/app.sock</text>
    <rect id="server" data-svg-box="" data-svg-padding="12" x="735" y="235" width="210" height="110" rx="16" fill="#e9f7f3"/><text x="840" y="282" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="server">服务进程</text><text x="840" y="316" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="server">accept 连接</text>
    <rect id="feat" data-svg-box="" data-svg-padding="12" x="250" y="480" width="500" height="58" rx="15" fill="#ffffff" stroke="#dfe3ef" stroke-width="2"/>
    <text x="500" y="517" text-anchor="middle" font-size="20" fill="#4256c6" data-svg-container="feat">双向通信 · 多客户端 · 可传文件描述符</text>
  </g>
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M265 180C350 180 345 240 385 255" stroke="#5268d8" marker-end="url(#a)"/><path d="M385 270C345 255 350 205 265 205" stroke="#14967f" marker-end="url(#b)"/>
    <path d="M265 385C350 385 345 330 385 305" stroke="#5268d8" marker-end="url(#a)"/><path d="M385 320C345 340 350 405 265 405" stroke="#14967f" marker-end="url(#b)"/>
    <path d="M615 265H719" stroke="#5268d8" marker-end="url(#a)"/><path d="M735 320H631" stroke="#14967f" marker-end="url(#b)"/>
  </g>
  <text x="335" y="172" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" fill="#667085" data-svg-label="">请求</text><text x="330" y="425" font-family="system-ui,-apple-system,'PingFang SC',sans-serif" font-size="17" fill="#667085" data-svg-label="">响应</text>
</svg>
