<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc">
  <title id="title">内核消息队列</title><desc id="desc">生产者把带边界的消息放入内核队列，消费者逐条读取，消息从队列移除。</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#7b61b5"/></marker></defs>
  <rect width="1000" height="580" rx="24" fill="#f7f8fc"/>
  <g font-family="system-ui,-apple-system,'PingFang SC',sans-serif" fill="#17223b">
    <text x="40" y="58" font-size="32" font-weight="700" data-svg-label="">消息队列：按“条”存取</text>
    <rect id="prod" data-svg-box="" data-svg-padding="12" x="55" y="220" width="200" height="110" rx="16" fill="#f1ecfa"/><text x="155" y="270" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="prod">生产者</text><text x="155" y="304" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="prod">mq_send</text>
    <rect id="queue" data-svg-box="" data-svg-padding="12" x="385" y="110" width="230" height="370" rx="20" fill="#ffffff" stroke="#b8a9d8" stroke-width="2"/>
    <text x="500" y="151" text-anchor="middle" font-size="23" font-weight="700" fill="#6d4ca7" data-svg-container="queue">内核队列</text>
    <rect id="m3" data-svg-box="" data-svg-padding="12" x="415" y="175" width="170" height="68" rx="12" fill="#f1ecfa"/><path d="M433 193l20 15 20-15" fill="none" stroke="#7b61b5" stroke-width="3"/><text x="525" y="217" text-anchor="middle" font-size="20" font-weight="650" data-svg-container="m3">消息 3</text>
    <rect id="m2" data-svg-box="" data-svg-padding="12" x="415" y="267" width="170" height="68" rx="12" fill="#f1ecfa"/><path d="M433 285l20 15 20-15" fill="none" stroke="#7b61b5" stroke-width="3"/><text x="525" y="309" text-anchor="middle" font-size="20" font-weight="650" data-svg-container="m2">消息 2</text>
    <rect id="m1" data-svg-box="" data-svg-padding="12" x="415" y="359" width="170" height="68" rx="12" fill="#7b61b5"/><path d="M433 377l20 15 20-15" fill="none" stroke="#fff" stroke-width="3"/><text x="525" y="401" text-anchor="middle" font-size="20" font-weight="650" fill="#fff" data-svg-container="m1">消息 1</text>
    <rect id="consumer" data-svg-box="" data-svg-padding="12" x="745" y="220" width="200" height="110" rx="16" fill="#f1ecfa"/><text x="845" y="270" text-anchor="middle" font-size="25" font-weight="700" data-svg-container="consumer">消费者</text><text x="845" y="304" text-anchor="middle" font-size="18" fill="#667085" data-svg-container="consumer">mq_receive</text>
    <rect id="mqnote" data-svg-box="" data-svg-padding="12" x="230" y="505" width="540" height="58" rx="14" fill="#fff4e8"/><text x="500" y="540" text-anchor="middle" font-size="19" fill="#a45a17" data-svg-container="mqnote">有边界 · 容量有限 · 读取即移除 · 不落盘</text>
  </g>
  <path d="M255 275C320 275 335 205 369 205" fill="none" stroke="#7b61b5" stroke-width="3" marker-end="url(#a)"/><path d="M615 393H729" fill="none" stroke="#7b61b5" stroke-width="3" marker-end="url(#a)"/>
</svg>
