<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">OpenClaw 写入路径：一条消息怎样变成长期记忆</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97745"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .colhead { font-size: 26px; font-weight: 600; fill: #6b6f76; }
      .body { font-size: 24px; }
      .cell { stroke-width: 2; rx: 10; }
    </style>
  </defs>
  <rect width="1440" height="880" fill="#fbfaf6"/>

  <text class="title" x="60" y="68">写入路径：不是每句话都会走完整个流程</text>
  <text class="sub" x="60" y="112">不同数据有不同的更新触发器；标橙的两条限制来自 2026.10.10 固定版本源码</text>

  <text class="colhead" x="225" y="172" text-anchor="middle">触发方式</text>
  <text class="colhead" x="680" y="172" text-anchor="middle">处理过程</text>
  <text class="colhead" x="1170" y="172" text-anchor="middle">写入目标</text>

  <!-- R1 -->
  <rect class="cell" x="60" y="190" width="330" height="100" fill="#e7edf3" stroke="#b9c6d4"/>
  <text class="body" x="225" y="248" text-anchor="middle">每条用户消息 / 工具结果</text>
  <line x1="394" y1="240" x2="462" y2="240" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="470" y="190" width="420" height="100" fill="#fffef9" stroke="#c9c2b2"/>
  <text class="body" x="680" y="248" text-anchor="middle">程序直接保存，无需模型判断</text>
  <line x1="894" y1="240" x2="962" y2="240" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="970" y="190" width="420" height="100" fill="#e7edf3" stroke="#b9c6d4"/>
  <text class="body" x="1180" y="248" text-anchor="middle">Agent SQLite：原始会话</text>

  <!-- R2 -->
  <rect class="cell" x="60" y="296" width="330" height="100" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text class="body" x="225" y="354" text-anchor="middle">模型主动记笔记</text>
  <line x1="394" y1="346" x2="462" y2="346" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="470" y="296" width="420" height="100" fill="#fffef9" stroke="#c9c2b2"/>
  <text class="body" x="680" y="354" text-anchor="middle">模型挑选持续有用的信息</text>
  <line x1="894" y1="346" x2="962" y2="346" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="970" y="296" width="420" height="100" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text class="body" x="1180" y="354" text-anchor="middle">当天日记 memory/YYYY-MM-DD.md</text>

  <!-- R3 -->
  <rect class="cell" x="60" y="402" width="330" height="100" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text class="body" x="225" y="460" text-anchor="middle">压缩前 memory flush</text>
  <line x1="394" y1="452" x2="462" y2="452" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="470" y="402" width="420" height="100" fill="#f9ecdf" stroke="#e0b48f"/>
  <text class="body" x="680" y="446" text-anchor="middle">静默补记，只追加当天日记</text>
  <text class="body" x="680" y="482" text-anchor="middle" fill="#b35c2e">MEMORY.md 等保持只读</text>
  <line x1="894" y1="452" x2="962" y2="452" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="970" y="402" width="420" height="100" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text class="body" x="1180" y="460" text-anchor="middle">当天日记（追加，不覆盖）</text>

  <!-- R4 -->
  <rect class="cell" x="60" y="508" width="330" height="100" fill="#efe9f4" stroke="#c3b4d6"/>
  <text class="body" x="225" y="566" text-anchor="middle">日记 / 会话 / 召回信号</text>
  <line x1="394" y1="558" x2="462" y2="558" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="470" y="508" width="420" height="100" fill="#efe9f4" stroke="#c3b4d6"/>
  <text class="body" x="680" y="548" text-anchor="middle">Light 去重 → REM 反思</text>
  <text class="body" x="680" y="586" text-anchor="middle">Deep 门槛 0.75 · 召回 ≥3 · 查询 ≥3</text>
  <line x1="894" y1="558" x2="962" y2="558" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="970" y="508" width="420" height="100" fill="#f9ecdf" stroke="#e0b48f"/>
  <text class="body" x="1180" y="546" text-anchor="middle" font-weight="600">MEMORY.md</text>
  <text class="body" x="1180" y="584" text-anchor="middle" fill="#b35c2e">Deep 唯一长期写入目标</text>

  <!-- R5 -->
  <rect class="cell" x="60" y="614" width="330" height="100" fill="#e7edf3" stroke="#b9c6d4"/>
  <text class="body" x="225" y="672" text-anchor="middle">明确要求记住偏好</text>
  <line x1="394" y1="664" x2="462" y2="664" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="470" y="614" width="420" height="100" fill="#fffef9" stroke="#c9c2b2"/>
  <text class="body" x="680" y="672" text-anchor="middle">读取现有文件后调用文件工具</text>
  <line x1="894" y1="664" x2="962" y2="664" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="970" y="614" width="420" height="100" fill="#e7edf3" stroke="#b9c6d4"/>
  <text class="body" x="1180" y="672" text-anchor="middle">USER.md（稳定偏好）</text>

  <!-- R6 -->
  <rect class="cell" x="60" y="720" width="330" height="100" fill="#e7edf3" stroke="#b9c6d4"/>
  <text class="body" x="225" y="778" text-anchor="middle">明确要求未来提醒</text>
  <line x1="394" y1="770" x2="462" y2="770" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="470" y="720" width="420" height="100" fill="#fffef9" stroke="#c9c2b2"/>
  <text class="body" x="680" y="778" text-anchor="middle">校验 owner / channel / sender</text>
  <line x1="894" y1="770" x2="962" y2="770" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <rect class="cell" x="970" y="720" width="420" height="100" fill="#e7edf3" stroke="#b9c6d4"/>
  <text class="body" x="1180" y="778" text-anchor="middle">Standing Intent / Automation</text>

  <text class="sub" x="60" y="862">注：flush 只追加当天日记；Deep 只写 MEMORY.md，不自动维护 USER.md——稳定偏好仍要靠明确要求并检查文件。</text>
</svg>
