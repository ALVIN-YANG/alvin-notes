<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 850" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">OpenClaw 混合检索：向量与关键词两路搜索，经缩放合并、排序调整与 MMR 返回少量片段</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97745"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1440" height="850" fill="#fbfaf6"/>

  <text data-svg-label="" class="title" x="60" y="68">混合检索：两路搜索，多层排序</text>
  <text data-svg-label="" class="sub" x="60" y="112">默认 vector 0.7 / text 0.3 只是排序第一步；minScore 资格判断使用衰减前的分数</text>

  <!-- 查询 -->
  <rect id="node-1" data-svg-box="" class="box" x="60" y="340" width="210" height="80" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-1" class="head" x="165" y="391" text-anchor="middle">用户问题</text>

  <!-- 两路搜索 -->
  <rect id="node-2" data-svg-box="" class="box" x="330" y="170" width="290" height="140" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-2" class="head" x="475" y="216" text-anchor="middle">向量搜索</text>
  <text data-svg-container="node-2" class="body" x="475" y="262" text-anchor="middle">语义相近也能匹配</text>

  <rect id="node-3" data-svg-box="" class="box" x="330" y="420" width="290" height="170" fill="#e7edf3" stroke="#b9c6d4"/>
  <text data-svg-container="node-3" class="head" x="475" y="466" text-anchor="middle">关键词 + 文件名搜索</text>
  <text data-svg-container="node-3" class="body" x="475" y="510" text-anchor="middle">正文 trigram 分词</text>
  <text data-svg-container="node-3" class="body" x="475" y="548" text-anchor="middle">文件名精确匹配优先</text>

  <line x1="272" y1="365" x2="324" y2="255" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="272" y1="405" x2="324" y2="495" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 合并 -->
  <rect id="node-4" data-svg-box="" class="box" x="660" y="250" width="330" height="244" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-4" class="head" x="825" y="296" text-anchor="middle">加权合并</text>
  <text data-svg-container="node-4" class="body" x="825" y="340" text-anchor="middle">先缩放关键词得分</text>
  <text data-svg-container="node-4" class="body" x="825" y="376" text-anchor="middle">再按权重合并</text>
  <text data-svg-container="node-4" class="body" x="825" y="418" text-anchor="middle">vector 0.7 / text 0.3</text>
  <text data-svg-container="node-4" x="825" y="452" text-anchor="middle" font-size="24" font-weight="600" fill="#b35c2e">不是原始 BM25 直接相加</text>

  <line x1="620" y1="255" x2="654" y2="336" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="500" x2="654" y2="396" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 排序调整 -->
  <rect id="node-5" data-svg-box="" class="box" x="1060" y="120" width="320" height="200" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text data-svg-container="node-5" class="head" x="1220" y="166" text-anchor="middle">排序调整</text>
  <text data-svg-container="node-5" class="body" x="1220" y="210" text-anchor="middle">时间衰减 · 重要性 1–10</text>
  <text data-svg-container="node-5" class="body" x="1220" y="246" text-anchor="middle">项目范围加权</text>
  <text data-svg-container="node-5" class="body" x="1220" y="282" text-anchor="middle" fill="#6b6f76">长期文件不随时间衰减</text>

  <line x1="990" y1="360" x2="1054" y2="240" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- MMR -->
  <rect id="node-6" data-svg-box="" class="box" x="1060" y="360" width="320" height="150" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-6" class="head" x="1220" y="406" text-anchor="middle">MMR 去重排序</text>
  <text data-svg-container="node-6" class="body" x="1220" y="446" text-anchor="middle">默认 lambda 0.7</text>
  <text data-svg-container="node-6" class="body" x="1220" y="484" text-anchor="middle">减少重复</text>

  <line x1="1220" y1="324" x2="1220" y2="354" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 结果 -->
  <rect id="node-7" data-svg-box="" class="box" x="1060" y="550" width="320" height="160" fill="#d97745" stroke="#d97745"/>
  <text data-svg-container="node-7" class="head" x="1220" y="596" text-anchor="middle" fill="#ffffff">Top snippets</text>
  <text data-svg-container="node-7" class="body" x="1220" y="640" text-anchor="middle" fill="#ffffff">返回少量最相关片段</text>
  <text data-svg-container="node-7" class="body" x="1220" y="680" text-anchor="middle" fill="#ffffff">可按行号再取原文</text>

  <line x1="1220" y1="514" x2="1220" y2="544" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <text data-svg-label="" class="sub" x="60" y="780">注：文件名完整匹配优先于部分匹配；时间影响排序，不会仅因内容旧就取消资格。</text>
  <text data-svg-label="" class="sub" x="60" y="820">没有可用 embedding provider 时，关键词搜索仍然可以工作。</text>
</svg>
