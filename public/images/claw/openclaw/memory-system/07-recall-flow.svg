<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">新会话依次打开固定文件、匹配触发词，仍无答案时由子代理搜索旧笔记和会话</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97745"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 27px; font-weight: 600; }
      .body { font-size: 24px; }
      .card { stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1440" height="860" fill="#fbfaf6"/>

  <text class="title" x="60" y="68">新会话怎样找到旧内容？</text>
  <text class="sub" x="60" y="112">按成本从低到高三步：先打开固定文件 → 再匹配触发词 → 仍无答案才搜索旧笔记和会话</text>

  <!-- 用户问题 -->
  <rect x="210" y="140" width="580" height="80" rx="12" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
  <text class="body" x="500" y="190" text-anchor="middle" font-weight="600">“我们之前决定住哪家酒店？”</text>
  <line x1="500" y1="224" x2="500" y2="240" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ① 打开固定文件 -->
  <rect class="card" x="60" y="246" width="880" height="150" fill="#fffef9" stroke="#c9c2b2"/>
  <text class="head" x="100" y="292"><tspan fill="#d97745">①</tspan> 打开固定文件</text>
  <text class="body" x="100" y="332">USER.md / MEMORY.md 随启动进入上下文</text>
  <text class="body" x="100" y="368" fill="#b35c2e">示例：“杭州住宿最后选择西湖边，没有订湖景房。”</text>

  <text x="170" y="424" font-size="24" font-weight="600" fill="#b35c2e">不能回答</text>
  <line x1="150" y1="400" x2="150" y2="430" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ② 匹配触发词 -->
  <rect class="card" x="60" y="436" width="880" height="150" fill="#f9ecdf" stroke="#e0b48f"/>
  <text class="head" x="100" y="482"><tspan fill="#d97745">②</tspan> 匹配触发词</text>
  <text class="body" x="100" y="522">问题里的“酒店”命中 trigger：杭州, 酒店, 湖景房</text>
  <text class="body" x="100" y="558">强命中（阈值 0.65，每轮最多 3 条）就把该条目交给主模型</text>

  <text x="170" y="614" font-size="24" font-weight="600" fill="#b35c2e">没有强命中</text>
  <line x1="150" y1="590" x2="150" y2="620" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ③ 子代理搜索 -->
  <rect class="card" x="60" y="626" width="880" height="150" fill="#efe9f4" stroke="#c3b4d6"/>
  <text class="head" x="100" y="672"><tspan fill="#d97745">③</tspan> 仍无答案：子代理搜索旧笔记和会话</text>
  <text class="body" x="100" y="712">默认 escalate，且识别到回顾意图才启动 Active Memory 子代理</text>
  <text class="body" x="100" y="748">memory_search → memory_get，把相关摘录交给主模型</text>

  <!-- 三条横向箭头 -->
  <text x="946" y="314" font-size="24" font-weight="600" fill="#b35c2e">能回答</text>
  <line x1="944" y1="330" x2="1012" y2="342" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="946" y="504" font-size="24" font-weight="600" fill="#b35c2e">强命中</text>
  <line x1="944" y1="520" x2="1012" y2="506" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="946" y="666" font-size="24" font-weight="600" fill="#b35c2e">摘录</text>
  <line x1="944" y1="700" x2="1012" y2="662" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 统一终点 -->
  <rect x="1020" y="246" width="360" height="530" rx="14" fill="#d97745" stroke="#d97745" stroke-width="2"/>
  <text x="1200" y="308" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">统一终点</text>
  <text x="1200" y="348" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">主模型回答</text>
  <line x1="1070" y1="380" x2="1330" y2="380" stroke="#f2c4a6" stroke-width="2"/>
  <text x="1200" y="440" text-anchor="middle" class="body" fill="#ffffff">“之前选择了西湖边的酒店，</text>
  <text x="1200" y="478" text-anchor="middle" class="body" fill="#ffffff">没有订湖景房（超出预算）。”</text>
  <text x="1200" y="560" text-anchor="middle" class="body" fill="#ffffff">每一步读到的内容</text>
  <text x="1200" y="596" text-anchor="middle" class="body" fill="#ffffff">都交给主模型作答</text>

  <!-- 底部小注 -->
  <text class="sub" x="60" y="824">注：trigger 是找旧记忆；Standing Intent 是执行之前创建的提醒，两者不要混淆。</text>
  <text class="sub" x="60" y="856">召回失败、超时或返回空结果，主回复仍继续；“没有找到”不等于“历史上没有这件事”。</text>
</svg>
