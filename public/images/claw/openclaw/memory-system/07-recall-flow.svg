<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">OpenClaw 召回流程：trigger 快速通道未命中时升级 Active Memory 深度召回</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97745"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#fbfaf6"/>

  <text class="title" x="60" y="68">召回流程：“我们之前决定住哪家酒店？”</text>
  <text class="sub" x="60" y="112">/new 新会话 · 杭州两日游案例 · Active Memory 默认 escalate 模式</text>

  <!-- 左链 -->
  <rect class="box" x="60" y="150" width="560" height="90" fill="#e7edf3" stroke="#b9c6d4"/>
  <text class="body" x="340" y="204" text-anchor="middle" font-weight="600">“我们之前决定住哪家酒店？”（回顾意图）</text>

  <line x1="340" y1="244" x2="340" y2="274" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="60" y="280" width="560" height="110" fill="#fffef9" stroke="#c9c2b2"/>
  <text class="head" x="340" y="322" text-anchor="middle">启动加载</text>
  <text class="body" x="340" y="360" text-anchor="middle">合格私有会话：加载 USER.md / MEMORY.md</text>
  <text class="body" x="340" y="392" text-anchor="middle" fill="#6b6f76">来源不合格与 untrusted 根文件排除</text>

  <line x1="340" y1="394" x2="340" y2="414" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="60" y="420" width="560" height="140" fill="#f9ecdf" stroke="#e0b48f"/>
  <text class="head" x="340" y="464" text-anchor="middle">Lane 1 trigger 快速通道</text>
  <text class="body" x="340" y="506" text-anchor="middle">长期条目 trigger 是否强命中？</text>
  <text class="body" x="340" y="540" text-anchor="middle">阈值 0.65 · 每轮最多 3 条 · 项目须匹配</text>

  <text x="356" y="592" font-size="24" font-weight="600" fill="#b35c2e">否（默认 escalate）</text>
  <line x1="340" y1="564" x2="340" y2="594" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="60" y="600" width="560" height="190" fill="#efe9f4" stroke="#c3b4d6"/>
  <text class="head" x="340" y="642" text-anchor="middle">Active Memory 深度召回</text>
  <text class="body" x="340" y="678" text-anchor="middle">识别到回顾意图，启动子代理</text>
  <text class="body" x="340" y="710" text-anchor="middle">受限工具 + 父会话授权的可见范围</text>
  <text class="body" x="340" y="742" text-anchor="middle">memory_search → memory_get</text>
  <text class="body" x="340" y="772" text-anchor="middle" fill="#6b6f76">会话命中改走 sessions_search / history</text>

  <!-- 右列 -->
  <text x="648" y="336" font-size="24" font-weight="600" fill="#b35c2e">是</text>
  <line x1="620" y1="462" x2="694" y2="244" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect class="box" x="700" y="150" width="680" height="110" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text class="head" x="1040" y="196" text-anchor="middle">强命中：注入最多 3 条长期条目</text>
  <text class="body" x="1040" y="234" text-anchor="middle">trigger 条目直接进入主模型上下文</text>

  <line x1="1040" y1="264" x2="1040" y2="594" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1064" y="440" class="sub">两条路径汇合</text>

  <rect class="box" x="700" y="600" width="680" height="160" fill="#f9ecdf" stroke="#e0b48f"/>
  <text class="head" x="1040" y="646" text-anchor="middle">主模型生成回答</text>
  <text class="body" x="1040" y="684" text-anchor="middle">结合启动加载与读回的记忆作答</text>
  <text class="body" x="1040" y="718" text-anchor="middle">召回失败、工具禁用或超时，主回复仍继续</text>
  <text class="body" x="1040" y="748" text-anchor="middle" fill="#b35c2e">“没有找到”不能写成“历史上没有这件事”</text>

  <line x1="620" y1="695" x2="694" y2="695" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="sub" x="60" y="852">注：trigger 通道只接受 trusted 且 eligible 的 MEMORY.md / USER.md 条目；日记与原始会话不能走快速通道。</text>
  <text class="sub" x="60" y="884">群聊、频道和当前会话不属于跨私有会话召回来源。</text>
</svg>
