<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">固定加载与按需检索的分工，以及各自的代表实现</title>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .card { stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1440" height="920" fill="#fbfaf6"/>

  <text data-svg-label="" class="title" x="60" y="68">召回：固定加载与按需检索，两条腿走路</text>
  <text data-svg-label="" class="sub" x="60" y="112">小文件放“总要记住的”，大库放“可能用得着的”；先读固定文件，不够再检索</text>

  <rect id="node-1" data-svg-box="" class="card" x="60" y="160" width="640" height="400" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text data-svg-container="node-1" class="head" x="100" y="204">固定加载：启动就在</text>
  <text data-svg-container="node-1" class="body" x="100" y="252">OpenClaw：启动读 USER/MEMORY</text>
  <text data-svg-container="node-1" class="body" x="100" y="296">Hermes：冻结快照注入</text>
  <text data-svg-container="node-1" class="body" x="100" y="340">优点：零检索成本</text>
  <text data-svg-container="node-1" class="body" x="100" y="384">快照保住 prompt 缓存</text>
  <text data-svg-container="node-1" class="body" x="100" y="428">缺点：容量必须小</text>
  <text data-svg-container="node-1" class="body" x="100" y="472">中途写入下次会话可见</text>

  <rect id="node-2" data-svg-box="" class="card" x="740" y="160" width="640" height="400" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-2" class="head" x="780" y="204">按需检索：需要才查</text>
  <text data-svg-container="node-2" class="body" x="780" y="252">OpenClaw：memory_search</text>
  <text data-svg-container="node-2" class="body" x="780" y="296">Hermes：session_search</text>
  <text data-svg-container="node-2" class="body" x="780" y="340">Mem0 / Hindsight：search/recall</text>
  <text data-svg-container="node-2" class="body" x="780" y="384">多信号 + 融合 + rerank</text>
  <text data-svg-container="node-2" class="body" x="780" y="428">优点：库可以很大</text>
  <text data-svg-container="node-2" class="body" x="780" y="472">缺点：有延迟与调用成本</text>

  <rect id="node-3" data-svg-box="" class="card" x="60" y="630" width="1320" height="130" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-3" class="head" x="100" y="674">组合方式决定体验</text>
  <text data-svg-container="node-3" class="body" x="100" y="718">固定加载管“必然要用”，按需检索管“偶尔要用”；检索结果按参考数据注入</text>

  <text data-svg-label="" class="sub" x="60" y="820">检索算法见《混合检索原理》；归属过滤用 pre-filter。</text>
  <text data-svg-label="" class="sub" x="60" y="860">召回失败只能说“没有找到”，不能说“历史上没有这件事”。</text>
</svg>
