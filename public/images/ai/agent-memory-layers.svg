<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 600" role="img" aria-labelledby="title desc">
  <title id="title">工作上下文与跨会话记忆怎样参与任务</title>
  <desc id="desc">当前任务状态和相关跨会话记忆按需进入上下文。执行后，只写入有价值且来源可查的记忆。权限由执行代码校验，工具执行事实单独保存在任务或业务记录中。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
  <rect width="380" height="600" rx="12" fill="#f8fafc"/>
  <g font-family="'MiSans Web', 'PingFang SC', sans-serif" text-anchor="middle">
    <text x="190" y="32" font-size="19" font-weight="600" fill="#0f172a">先取相关信息，再决定是否记住</text>
    <rect x="24" y="55" width="332" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="190" y="82" font-size="18" font-weight="600" fill="#1e40af">当前任务状态</text>
    <text x="190" y="108" font-size="15" fill="#334155">目标、最新约束、进度、结果引用</text>
    <rect x="24" y="140" width="332" height="86" rx="10" fill="#ecfdf5" stroke="#22c55e"/>
    <text x="190" y="168" font-size="18" font-weight="600" fill="#166534">按需检索跨会话记忆</text>
    <text x="190" y="193" font-size="15" fill="#334155">事件记录：发生过什么</text>
    <text x="190" y="214" font-size="15" fill="#334155">稳定事实与偏好：来源、版本、有效期</text>
    <path d="M190 227V250" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="257" width="332" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="190" y="284" font-size="18" font-weight="600" fill="#92400e">组装这一步需要的上下文</text>
    <text x="190" y="310" font-size="15" fill="#334155">旧偏好不能覆盖用户当前的明确要求</text>
    <path d="M190 328V352" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="359" width="332" height="60" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="190" y="395" font-size="18" fill="#334155">模型判断 · 工具执行</text>
    <path d="M190 420V444" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="24" y="451" width="332" height="86" rx="10" fill="#eef2ff" stroke="#6366f1"/>
    <text x="190" y="479" font-size="18" font-weight="600" fill="#3730a3">写入前筛选</text>
    <text x="190" y="505" font-size="15" fill="#334155">只保留有用、可追溯、允许保存的内容</text>
    <text x="190" y="525" font-size="15" fill="#334155">过期、冲突和删除要同时处理派生记录</text>
    <text x="190" y="567" font-size="14" fill="#475569">权限由代码校验，执行事实单独落库</text>
    <text x="190" y="588" font-size="14" fill="#475569">语义相似的记忆不能证明“已经执行”</text>
  </g>
</svg>
