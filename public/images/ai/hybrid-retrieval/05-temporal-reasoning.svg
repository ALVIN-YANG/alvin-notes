<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">时间轴上的三条记忆，与当前、过去、未来三种问题意图</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97745"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .card { stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1440" height="900" fill="#fbfaf6"/>

  <text data-svg-label="" class="title" x="60" y="68">时间推理：先听懂问题问的是什么时候</text>
  <text data-svg-label="" class="sub" x="60" y="112">每条记忆带事件时间；当前、过去、未来是三种不同的问题意图</text>

  <rect id="node-1" data-svg-box="" class="card" x="120" y="180" width="360" height="120" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-1" class="head" x="300" y="224" text-anchor="middle">M1 · 周一</text>
  <text data-svg-container="node-1" class="body" x="300" y="264" text-anchor="middle">喜欢蓝莓，不要芒果</text>

  <rect id="node-2" data-svg-box="" class="card" x="540" y="180" width="360" height="120" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-2" class="head" x="720" y="224" text-anchor="middle">M2 · 周二</text>
  <text data-svg-container="node-2" class="body" x="720" y="264" text-anchor="middle">下单买了蓝莓</text>

  <rect id="node-3" data-svg-box="" class="card" x="960" y="180" width="360" height="120" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-3" class="head" x="1140" y="224" text-anchor="middle">M3 · 周三</text>
  <text data-svg-container="node-3" class="body" x="1140" y="264" text-anchor="middle">以后只想买苹果</text>

  <line x1="300" y1="304" x2="300" y2="326" stroke="#8a8f98" stroke-width="2.5"/>
  <line x1="720" y1="304" x2="720" y2="326" stroke="#8a8f98" stroke-width="2.5"/>
  <line x1="1140" y1="304" x2="1140" y2="326" stroke="#8a8f98" stroke-width="2.5"/>
  <line x1="100" y1="330" x2="1336" y2="330" stroke="#8a8f98" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <line x1="270" y1="334" x2="270" y2="396" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="720" y1="334" x2="720" y2="396" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1170" y1="334" x2="1170" y2="396" stroke="#d97745" stroke-width="3" marker-end="url(#arrow)"/>

  <rect id="node-4" data-svg-box="" class="card" x="60" y="400" width="420" height="160" fill="#e7edf3" stroke="#b9c6d4"/>
  <text data-svg-container="node-4" class="head" x="270" y="444" text-anchor="middle">“现在推荐什么？”</text>
  <text data-svg-container="node-4" class="body" x="270" y="488" text-anchor="middle">意图：当前状态</text>
  <text data-svg-container="node-4" class="body" x="270" y="528" text-anchor="middle">优先 M3（最新偏好）</text>

  <rect id="node-5" data-svg-box="" class="card" x="510" y="400" width="420" height="160" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-5" class="head" x="720" y="444" text-anchor="middle">“周二买了什么？”</text>
  <text data-svg-container="node-5" class="body" x="720" y="488" text-anchor="middle">意图：过去事件</text>
  <text data-svg-container="node-5" class="body" x="720" y="528" text-anchor="middle">定位 M2 的日期</text>

  <rect id="node-6" data-svg-box="" class="card" x="960" y="400" width="420" height="160" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-6" class="head" x="1170" y="444" text-anchor="middle">“下周吃什么？”</text>
  <text data-svg-container="node-6" class="body" x="1170" y="488" text-anchor="middle">意图：未来计划</text>
  <text data-svg-container="node-6" class="body" x="1170" y="528" text-anchor="middle">看生效中的 M3</text>

  <rect id="node-7" data-svg-box="" class="card" x="60" y="630" width="1320" height="130" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-7" class="head" x="100" y="674">时间衰减 ≠ 时间推理</text>
  <text data-svg-container="node-7" class="body" x="100" y="718">衰减：旧内容统一降权，score × 0.5^(天数/半衰期)；推理：按问题意图选日期</text>

  <text data-svg-label="" class="sub" x="60" y="820">注：事件时间（说的是哪天）和写入时间（哪天存的）要分开记录。</text>
  <text data-svg-label="" class="sub" x="60" y="860">只有时间衰减、没有意图判断，仍可能把旧偏好排在最前。</text>
</svg>
