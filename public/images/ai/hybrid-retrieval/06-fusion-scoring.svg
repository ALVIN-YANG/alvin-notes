<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">加权求和与 RRF 的计算对比，以及可选的 rerank 重排</title>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .card { stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1440" height="1010" fill="#fbfaf6"/>

  <text data-svg-label="" class="title" x="60" y="68">融合评分：多个信号怎样计票</text>
  <text data-svg-label="" class="sub" x="60" y="112">原始分数不能直接相加：余弦约 0.99，BM25 可能 1.48，量纲不同</text>

  <rect id="node-1" data-svg-box="" class="card" x="60" y="160" width="640" height="470" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-1" class="head" x="100" y="204">方法一：加权求和</text>
  <text data-svg-container="node-1" class="body" x="100" y="256">先把各信号归一化到 0～1</text>
  <text data-svg-container="node-1" x="100" y="300" font-size="24" font-weight="600" fill="#b35c2e">score = 0.7×语义 + 0.3×BM25</text>
  <text data-svg-container="node-1" class="body" x="100" y="352">A：0.7×0.92 + 0.3×0.40 = 0.764</text>
  <text data-svg-container="node-1" class="body" x="100" y="396">B：0.7×0.85 + 0.3×0.95 = 0.880</text>
  <text data-svg-container="node-1" class="body" x="100" y="440" font-weight="600">B 排前</text>
  <text data-svg-container="node-1" class="body" x="100" y="496">优点：保留分数差距</text>
  <text data-svg-container="node-1" class="body" x="100" y="540">代价：要归一化、要调权重</text>

  <rect id="node-2" data-svg-box="" class="card" x="740" y="160" width="640" height="470" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-2" class="head" x="780" y="204">方法二：RRF 倒数排名融合</text>
  <text data-svg-container="node-2" class="body" x="780" y="256">只看名次，不看原始分数</text>
  <text data-svg-container="node-2" x="780" y="300" font-size="24" font-weight="600" fill="#b35c2e">RRF = Σ 1 / (60 + 名次)</text>
  <text data-svg-container="node-2" class="body" x="780" y="352">A：1/61 + 1/63 ≈ 0.0323</text>
  <text data-svg-container="node-2" class="body" x="780" y="396">B：1/62 + 1/61 ≈ 0.0325</text>
  <text data-svg-container="node-2" class="body" x="780" y="440" font-weight="600">B 排前；C ≈ 0.0320</text>
  <text data-svg-container="node-2" class="body" x="780" y="496">优点：免归一化，抗异常分</text>
  <text data-svg-container="node-2" class="body" x="780" y="540">代价：丢掉分数差距信息</text>

  <rect id="node-3" data-svg-box="" class="card" x="60" y="690" width="1320" height="170" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-3" class="head" x="100" y="734">还可以再重排（rerank）</text>
  <text data-svg-container="node-3" class="body" x="100" y="778">把问题和每条候选一起交给模型重新打分：更准但更慢，常用于 top_20 → top_3</text>
  <text data-svg-container="node-3" class="body" x="100" y="822">交叉编码器（cross-encoder）逐条精算，先用快排序缩小候选范围</text>

  <text data-svg-label="" class="sub" x="60" y="920">注：A、B、C 是候选记忆；示例名次：语义 A1 B2 C3，BM25 B1 C2 A3。</text>
  <text data-svg-label="" class="sub" x="60" y="960">RRF 的 k=60 是常见默认值；具体产品的权重和公式以其文档为准。</text>
</svg>
