<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="540" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc">
<title id="title">一次真实语音从提交到起播的 7,418 毫秒</title>
<desc id="desc">四段依次为 ASR 收尾 579 毫秒，ASR final 到 HTTP 发出约 3686 毫秒，HTTP 发出到首个正文约 2463 毫秒，首个正文到 playing 690 毫秒。起点是 UI 提交，不含之前的 VAD 判停。</desc>
<rect width="1040" height="540" rx="24" fill="#faf8f3"/>
<g font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#17354f">
<text x="52" y="57" font-size="18" fill="#667783" letter-spacing="2">真实语音 · 单轮日志 · 2026-10-23</text>
<text x="52" y="108" font-size="33" font-weight="700">提交之后，还等了 7,418 ms</text>
<text x="52" y="145" font-size="18" fill="#667783">UI commit</text>
<text x="988" y="145" text-anchor="end" font-size="18" fill="#667783">首次 playing</text>
<rect x="52.00" y="161" width="73.06" height="70" fill="#287f91"/>
<rect x="125.06" y="161" width="465.10" height="70" fill="#d69239"/>
<rect x="590.16" y="161" width="310.78" height="70" fill="#596ab2"/>
<rect x="900.94" y="161" width="87.06" height="70" fill="#3c8770"/>
<text x="52" y="260" font-size="17" fill="#667783">条形长度按同一轮耗时比例绘制</text>
<rect x="52" y="290" width="10" height="63" rx="5" fill="#287f91"/>
  <text x="78" y="310" font-size="23" fill="#526071">ASR 收尾</text>
  <text x="78" y="349" font-size="31" font-weight="700">579 ms</text>
<rect x="536" y="290" width="10" height="63" rx="5" fill="#d69239"/>
  <text x="562" y="310" font-size="23" fill="#526071">ASR final → HTTP 发出</text>
  <text x="562" y="349" font-size="31" font-weight="700">约 3,686 ms</text>
<rect x="52" y="394" width="10" height="63" rx="5" fill="#596ab2"/>
  <text x="78" y="414" font-size="23" fill="#526071">HTTP 发出 → 首个正文</text>
  <text x="78" y="453" font-size="31" font-weight="700">约 2,463 ms</text>
<rect x="536" y="394" width="10" height="63" rx="5" fill="#3c8770"/>
  <text x="562" y="414" font-size="23" fill="#526071">首个正文 → playing</text>
  <text x="562" y="453" font-size="31" font-weight="700">690 ms</text>
<text x="52" y="510" font-size="18" fill="#667783">不含提交前的 VAD 等待；HTTP 发出时点由日志推算；不代表平均或 P95。</text>
</g>
</svg>
