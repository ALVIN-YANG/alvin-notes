<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">六种产品方向：编码助手、自托管个人 Agent、商业个人助手、记忆服务、框架运行时、托管产品</title>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .card { stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1440" height="840" fill="#fbfaf6"/>

  <text data-svg-label="" class="title" x="60" y="68">Agent 记忆方案的六种产品方向</text>
  <text data-svg-label="" class="sub" x="60" y="112">先选方向，再选实现；不同方向解决不同场景的问题</text>

  <rect id="node-1" data-svg-box="" class="card" x="60" y="180" width="400" height="210" fill="#e7edf3" stroke="#b9c6d4"/>
  <text data-svg-container="node-1" class="head" x="260" y="224" text-anchor="middle">编码助手：文件记忆</text>
  <text data-svg-container="node-1" class="body" x="260" y="268" text-anchor="middle">Claude Code · Codex · Cursor</text>
  <text data-svg-container="node-1" class="body" x="260" y="312" text-anchor="middle">Cline · Gemini CLI</text>
  <text data-svg-container="node-1" class="body" x="260" y="356" text-anchor="middle">人可读写，Git 共享</text>

  <rect id="node-2" data-svg-box="" class="card" x="520" y="180" width="400" height="210" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-2" class="head" x="720" y="224" text-anchor="middle">自托管个人 Agent</text>
  <text data-svg-container="node-2" class="body" x="720" y="268" text-anchor="middle">OpenClaw · Hermes · DSH</text>
  <text data-svg-container="node-2" class="body" x="720" y="312" text-anchor="middle">冷热分层 + 插件生态</text>
  <text data-svg-container="node-2" class="body" x="720" y="356" text-anchor="middle">数据在本地，可审查</text>

  <rect id="node-3" data-svg-box="" class="card" x="980" y="180" width="400" height="210" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-3" class="head" x="1180" y="224" text-anchor="middle">商业个人助手</text>
  <text data-svg-container="node-3" class="body" x="1180" y="268" text-anchor="middle">Muse · Dots · Grok Bot</text>
  <text data-svg-container="node-3" class="body" x="1180" y="312" text-anchor="middle">Replika（陪伴型）</text>
  <text data-svg-container="node-3" class="body" x="1180" y="356" text-anchor="middle">主动记忆，云端常驻</text>

  <rect id="node-4" data-svg-box="" class="card" x="60" y="460" width="400" height="210" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-4" class="head" x="260" y="504" text-anchor="middle">记忆服务 / SDK</text>
  <text data-svg-container="node-4" class="body" x="260" y="548" text-anchor="middle">Mem0 · Hindsight · Zep</text>
  <text data-svg-container="node-4" class="body" x="260" y="592" text-anchor="middle">Honcho · Letta · LangMem</text>
  <text data-svg-container="node-4" class="body" x="260" y="636" text-anchor="middle">接入自己的应用</text>

  <rect id="node-5" data-svg-box="" class="card" x="520" y="460" width="400" height="210" fill="#fffef9" stroke="#c9c2b2"/>
  <text data-svg-container="node-5" class="head" x="720" y="504" text-anchor="middle">框架运行时</text>
  <text data-svg-container="node-5" class="body" x="720" y="548" text-anchor="middle">LangGraph · ADK · CrewAI</text>
  <text data-svg-container="node-5" class="body" x="720" y="592" text-anchor="middle">任务断点与状态</text>
  <text data-svg-container="node-5" class="body" x="720" y="636" text-anchor="middle">≠ 长期用户偏好</text>

  <rect id="node-6" data-svg-box="" class="card" x="980" y="460" width="400" height="210" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text data-svg-container="node-6" class="head" x="1180" y="504" text-anchor="middle">托管产品</text>
  <text data-svg-container="node-6" class="body" x="1180" y="548" text-anchor="middle">ChatGPT · Claude.ai</text>
  <text data-svg-container="node-6" class="body" x="1180" y="592" text-anchor="middle">平台记忆功能</text>
  <text data-svg-container="node-6" class="body" x="1180" y="636" text-anchor="middle">不可移植</text>

  <text data-svg-label="" class="sub" x="60" y="740">先选产品方向，再选具体实现；行业场景（游戏、企业、指引）见第 6 节。</text>
  <text data-svg-label="" class="sub" x="60" y="780">同一应用可组合多个方向，例如文件记忆管项目 + 记忆服务管用户偏好。</text>
</svg>
