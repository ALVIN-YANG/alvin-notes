<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="svgTitle">
  <title id="svgTitle">记忆服务四组：提取型、图谱型、画像型、框架与自管型</title>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #24282f; }
      .title { font-size: 38px; font-weight: 700; }
      .sub { font-size: 24px; fill: #6b6f76; }
      .head { font-size: 26px; font-weight: 600; }
      .body { font-size: 24px; }
      .card { stroke-width: 2; rx: 14; }
    </style>
  </defs>
  <rect width="1440" height="860" fill="#fbfaf6"/>

  <text data-svg-label="" class="title" x="60" y="68">记忆服务：按主要产出分四组</text>
  <text data-svg-label="" class="sub" x="60" y="112">先确定要事实、关系还是画像；提取、构图、推理的成本依次上升</text>

  <rect id="node-1" data-svg-box="" class="card" x="60" y="160" width="640" height="250" fill="#f9ecdf" stroke="#e0b48f"/>
  <text data-svg-container="node-1" class="head" x="100" y="204">提取型</text>
  <text data-svg-container="node-1" class="body" x="100" y="248">Mem0 · Hindsight · Supermemory</text>
  <text data-svg-container="node-1" class="body" x="100" y="292">对话 → 事实条目</text>
  <text data-svg-container="node-1" class="body" x="100" y="336">有提取成本，可能记错</text>
  <text data-svg-container="node-1" class="body" x="100" y="380">适合：偏好与经历</text>

  <rect id="node-2" data-svg-box="" class="card" x="740" y="160" width="640" height="250" fill="#efe9f4" stroke="#c3b4d6"/>
  <text data-svg-container="node-2" class="head" x="780" y="204">图谱型</text>
  <text data-svg-container="node-2" class="body" x="780" y="248">Zep · Cognee</text>
  <text data-svg-container="node-2" class="body" x="780" y="292">实体关系随时间变化</text>
  <text data-svg-container="node-2" class="body" x="780" y="336">构图成本更高</text>
  <text data-svg-container="node-2" class="body" x="780" y="380">适合：关系与多跳问题</text>

  <rect id="node-3" data-svg-box="" class="card" x="60" y="460" width="640" height="250" fill="#e7edf3" stroke="#b9c6d4"/>
  <text data-svg-container="node-3" class="head" x="100" y="504">画像型</text>
  <text data-svg-container="node-3" class="body" x="100" y="548">Memobase · Honcho</text>
  <text data-svg-container="node-3" class="body" x="100" y="592">持续维护用户模型</text>
  <text data-svg-container="node-3" class="body" x="100" y="636">Honcho 后台形式逻辑推理</text>
  <text data-svg-container="node-3" class="body" x="100" y="680">适合：长期个性化</text>

  <rect id="node-4" data-svg-box="" class="card" x="740" y="460" width="640" height="250" fill="#e4ecdf" stroke="#a9c0a4"/>
  <text data-svg-container="node-4" class="head" x="780" y="504">框架与自管型</text>
  <text data-svg-container="node-4" class="body" x="780" y="548">LangMem · Letta</text>
  <text data-svg-container="node-4" class="body" x="780" y="592">热路径工具 + 后台整理</text>
  <text data-svg-container="node-4" class="body" x="780" y="636">Letta 由 Agent 自管文件</text>
  <text data-svg-container="node-4" class="body" x="780" y="680">适合：深度定制</text>

  <text data-svg-label="" class="sub" x="60" y="770">提取、构图、推理的成本依次上升；先确定要事实、关系还是画像。</text>
  <text data-svg-label="" class="sub" x="60" y="810">各产品完整拆解见「记忆项目」系列文章。</text>
</svg>
