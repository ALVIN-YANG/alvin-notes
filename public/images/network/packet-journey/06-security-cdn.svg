<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1122" role="img" aria-labelledby="svgTitle">
<title id="svgTitle">安全与加速：防火墙、DDoS 缓解与 CDN 边缘分发</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97745"/></marker></defs>
<rect width="1440" height="1122" fill="#fbfaf6"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#24282f">
<text x="60" y="68" font-size="38" font-weight="700" fill="#24282f" data-svg-label="">攻击在哪一环拦下，内容在哪一环拉近</text>
<text x="60" y="112" font-size="23" fill="#5c626b" data-svg-label="">防火墙按规则放行，DDoS 分三层淹没、缓解靠稀释与清洗；CDN 把内容复制到离用户近的边缘节点</text>
<rect id="node-1" data-svg-box="" x="60" y="150" width="640" height="232" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="88" y="195" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-1">防火墙：按规则放行或拦截</text>
<text x="88" y="238" font-size="22" fill="#24282f" data-svg-container="node-1">按端口：对公网封闭 3389 等高危端口</text>
<text x="88" y="279" font-size="22" fill="#24282f" data-svg-container="node-1">按 IP 黑白名单；按连接状态只放行正常 TCP</text>
<text x="88" y="319" font-size="22" fill="#24282f" data-svg-container="node-1">按协议：禁用明文的 Telnet/FTP</text>
<text x="88" y="360" font-size="22" fill="#24282f" data-svg-container="node-1">按时间、按应用内容识别</text>
<rect id="node-2" data-svg-box="" x="60" y="422" width="640" height="394" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="88" y="467" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-2">DDoS：不入侵，只淹没</text>
<text x="88" y="510" font-size="22" fill="#24282f" data-svg-container="node-2">带宽层：ICMP/UDP 洪水；反射放大——</text>
<text x="88" y="549" font-size="22" fill="#24282f" data-svg-container="node-2">几十字节 DNS 查询换近 3000 字节响应（约 50 倍）</text>
<text x="88" y="591" font-size="22" fill="#24282f" data-svg-container="node-2">连接层：SYN 洪水——只发 SYN 不完成握手，</text>
<text x="88" y="630" font-size="22" fill="#24282f" data-svg-container="node-2">耗尽连接表</text>
<text x="88" y="672" font-size="22" fill="#24282f" data-svg-container="node-2">应用层：HTTP 洪水——用真实 IP 或代理池</text>
<text x="88" y="710" font-size="22" fill="#24282f" data-svg-container="node-2">打计算与 IO</text>
<text x="88" y="753" font-size="22" fill="#24282f" data-svg-container="node-2">缓解：CDN 稀释、流量清洗（代答握手、</text>
<text x="88" y="791" font-size="22" fill="#24282f" data-svg-container="node-2">按 IP 信誉过滤）、BCP 38 入口源地址过滤</text>
<rect id="node-3" data-svg-box="" x="60" y="856" width="640" height="234" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="88" y="901" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-3">VPN：公网上的私有通道</text>
<text x="88" y="944" font-size="22" fill="#24282f" data-svg-container="node-3">隧道封装 + 加密 + 身份认证</text>
<text x="88" y="985" font-size="22" fill="#24282f" data-svg-container="node-3">三类：站点到站点、远程访问、SSL VPN</text>
<text x="88" y="1025" font-size="22" fill="#5c626b" data-svg-container="node-3">代价：要信任 VPN 服务商，加解密与绕行带来降速</text>
<text x="88" y="1066" font-size="22" fill="#5c626b" data-svg-container="node-3">且须合规使用</text>
<rect id="node-4" data-svg-box="" x="740" y="150" width="640" height="384" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="768" y="195" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-4">CDN：把内容复制到离用户近的边缘节点</text>
<rect id="node-5" data-svg-box="" x="768" y="236" width="130" height="70" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="833.0" y="280" font-size="23" font-weight="700" fill="#24282f" text-anchor="middle" data-svg-container="node-5">用户</text>
<rect id="node-6" data-svg-box="" x="978" y="236" width="150" height="70" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="1053.0" y="280" font-size="23" font-weight="700" fill="#24282f" text-anchor="middle" data-svg-container="node-6">边缘节点</text>
<rect id="node-7" data-svg-box="" x="1208" y="236" width="140" height="70" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="1278.0" y="280" font-size="23" font-weight="700" fill="#24282f" text-anchor="middle" data-svg-container="node-7">源站</text>
<text x="938" y="226" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-4">① 就近请求</text>
<text x="1162" y="226" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-4">未命中：回源</text>
<path d="M898 258L966 258" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M1128 258L1196 258" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M978 288L910 288" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="944" y="318" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-4">命中：直接返回</text>
<text x="768" y="389" font-size="22" fill="#24282f" data-svg-container="node-4">静态资源按 Cache-Control 缓存</text>
<text x="768" y="429" font-size="22" fill="#24282f" data-svg-container="node-4">未命中回源拉取（pull），或源站提前推送（push）</text>
<text x="768" y="469" font-size="22" fill="#24282f" data-svg-container="node-4">动态内容靠边缘函数就近执行</text>
<text x="768" y="510" font-size="22" fill="#24282f" data-svg-container="node-4">调度：DNS 智能解析或任播，把用户分到就近节点</text>
<rect id="node-8" data-svg-box="" x="740" y="574" width="640" height="524" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="768" y="619" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-8">性能优化三杠杆：按测、析、改、验循环</text>
<text x="768" y="665" font-size="23" font-weight="700" fill="#24282f" data-svg-container="node-8">① 减少传输量</text>
<text x="768" y="704" font-size="22" fill="#24282f" data-svg-container="node-8">压缩、缓存、合并请求、按需加载</text>
<text x="768" y="750" font-size="23" font-weight="700" fill="#24282f" data-svg-container="node-8">② 提升通路效率</text>
<text x="768" y="788" font-size="22" fill="#24282f" data-svg-container="node-8">连接池复用，避免重复握手</text>
<text x="768" y="827" font-size="22" fill="#24282f" data-svg-container="node-8">HTTP/2 多路复用；HTTP/3 的 0-RTT</text>
<text x="768" y="865" font-size="22" fill="#24282f" data-svg-container="node-8">有重放风险，只适合幂等请求</text>
<text x="768" y="910" font-size="23" font-weight="700" fill="#24282f" data-svg-container="node-8">③ 绕开瓶颈</text>
<text x="768" y="949" font-size="22" fill="#24282f" data-svg-container="node-8">就近接入、缓存预热</text>
<text x="768" y="987" font-size="22" fill="#24282f" data-svg-container="node-8">HTTPDNS 绕过运营商 LocalDNS 的劫持</text>
<text x="768" y="1032" font-size="22" fill="#5c626b" data-svg-container="node-8">指标看 RTT、吞吐、丢包率</text>
<text x="768" y="1070" font-size="22" fill="#5c626b" data-svg-container="node-8">单域名并发连接数是浏览器实现策略，非协议规定</text>
</g>
</svg>
