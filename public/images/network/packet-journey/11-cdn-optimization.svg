<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 990" role="img" aria-labelledby="svgTitle">
<title id="svgTitle">CDN 把内容拉近，性能优化用三个杠杆</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97745"/></marker></defs>
<rect width="1440" height="990" fill="#fbfaf6"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#24282f">
<text x="60" y="68" font-size="38" font-weight="700" fill="#24282f" data-svg-label="">慢的问题分两段解决：拉近与提效</text>
<text x="60" y="112" font-size="23" fill="#5c626b" data-svg-label="">CDN 把内容复制到边缘节点就近返回；优化按测、析、改、验循环，手段归为三个杠杆</text>
<rect id="node-1" data-svg-box="" x="60" y="150" width="1320" height="340" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="88" y="195" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-1">CDN：把内容复制到离用户近的边缘节点</text>
<rect id="node-2" data-svg-box="" x="120" y="240" width="150" height="70" rx="14" fill="#ffffff" stroke="#c9c2b2" stroke-width="2"/>
<text x="195.0" y="284" font-size="23" font-weight="700" fill="#24282f" text-anchor="middle" data-svg-container="node-2">用户</text>
<rect id="node-3" data-svg-box="" x="620" y="240" width="180" height="70" rx="14" fill="#ffffff" stroke="#c9c2b2" stroke-width="2"/>
<text x="710.0" y="284" font-size="23" font-weight="700" fill="#24282f" text-anchor="middle" data-svg-container="node-3">边缘节点</text>
<rect id="node-4" data-svg-box="" x="1120" y="240" width="150" height="70" rx="14" fill="#ffffff" stroke="#c9c2b2" stroke-width="2"/>
<text x="1195.0" y="284" font-size="23" font-weight="700" fill="#24282f" text-anchor="middle" data-svg-container="node-4">源站</text>
<text x="445" y="230" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-1">① 就近请求</text>
<text x="960" y="230" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-1">未命中：回源拉取（pull）</text>
<text x="445" y="322" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-1">命中：直接返回</text>
<path d="M272 262L618 262" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M802 262L1118 262" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<path d="M618 292L272 292" fill="none" stroke="#d97745" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="88" y="375" font-size="22" fill="#5c626b" data-svg-container="node-1">静态资源按 Cache-Control 缓存；也可由源站提前推送（push）</text>
<text x="88" y="413" font-size="22" fill="#5c626b" data-svg-container="node-1">动态内容靠边缘函数就近执行</text>
<text x="88" y="451" font-size="22" fill="#5c626b" data-svg-container="node-1">调度用 DNS 智能解析或任播，把用户分到就近节点</text>
<rect id="node-5" data-svg-box="" x="60" y="530" width="1320" height="420" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="88" y="575" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-5">性能优化：测、析、改、验，三个杠杆</text>
<text x="88" y="608" font-size="23" font-weight="700" fill="#24282f" data-svg-container="node-5">① 减少传输量：压缩、缓存、合并请求、按需加载</text>
<text x="88" y="652" font-size="23" font-weight="700" fill="#24282f" data-svg-container="node-5">② 提升通路效率</text>
<text x="88" y="692" font-size="22" fill="#24282f" data-svg-container="node-5">连接池复用避免重复握手；协议升级 HTTP/2 多路复用或 HTTP/3 并配好自动降级</text>
<text x="88" y="730" font-size="22" fill="#5c626b" data-svg-container="node-5">HTTP/3 的 0-RTT 建连有重放风险，只适合幂等请求</text>
<text x="88" y="766" font-size="22" fill="#5c626b" data-svg-container="node-5">单域名并发连接数是浏览器实现策略而非协议规定（HTTP/1.1 时代 Chrome 每域 6 个）</text>
<text x="88" y="802" font-size="22" fill="#5c626b" data-svg-container="node-5">拥塞控制：BBR 按带宽与时延建模、不看丢包，与 CUBIC 共存时可能挤占对方带宽，公平性需实测</text>
<text x="88" y="848" font-size="23" font-weight="700" fill="#24282f" data-svg-container="node-5">③ 绕开瓶颈：就近接入、缓存预热、HTTPDNS 绕过运营商 LocalDNS 的劫持与调度不准</text>
<text x="88" y="892" font-size="22" fill="#5c626b" data-svg-container="node-5">指标看 RTT、吞吐、丢包率；先测量再改动，改动后复验</text>
</g>
</svg>
