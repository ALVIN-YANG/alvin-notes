<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1158" role="img" aria-labelledby="svgTitle">
<title id="svgTitle">跨网段：路由器逐跳转发与 NAT 地址端口改写</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97745"/></marker></defs>
<rect width="1440" height="1158" fill="#fbfaf6"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#24282f">
<text x="60" y="68" font-size="38" font-weight="700" fill="#24282f" data-svg-label="">跨网段：路由器每跳做什么，NAT 改了什么</text>
<text x="60" y="112" font-size="23" fill="#5c626b" data-svg-label="">不经 NAT 时源/目的 IP 全程不变、每跳 MAC 重写；NAPT 把端口也纳入映射，回包按端口对号入座</text>
<rect id="node-1" data-svg-box="" x="60" y="150" width="640" height="480" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="88" y="195" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-1">路由器转发一个包的四件事</text>
<text x="88" y="239" font-size="23" fill="#24282f" data-svg-container="node-1">① 校验帧完整性（FCS），剥掉 MAC 头</text>
<text x="88" y="281" font-size="23" fill="#24282f" data-svg-container="node-1">② TTL 减 1，归 0 丢弃并回 ICMP 超时</text>
<text x="88" y="323" font-size="23" fill="#24282f" data-svg-container="node-1">③ 最长匹配查路由表：选前缀最长者</text>
<text x="88" y="365" font-size="23" fill="#24282f" data-svg-container="node-1">④ 按下一跳重写 MAC 头，发出</text>
<text x="88" y="407" font-size="22" fill="#5c626b" data-svg-container="node-1">traceroute 正是利用 TTL 超时回报工作</text>
<text x="88" y="450" font-size="22" fill="#5c626b" data-svg-container="node-1">路由表来源：接口直连、静态配置、OSPF/BGP 学习</text>
<text x="88" y="490" font-size="22" fill="#5c626b" data-svg-container="node-1">网关是逻辑角色：默认网关 = 默认路由的下一跳</text>
<text x="88" y="530" font-size="22" fill="#5c626b" data-svg-container="node-1">不经 NAT：源/目的 IP 全程不变，每跳 MAC 重写</text>
<text x="88" y="571" font-size="22" fill="#5c626b" data-svg-container="node-1">响应路径未必与去程对称</text>
<rect id="node-2" data-svg-box="" x="740" y="150" width="640" height="480" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="768" y="195" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-2">NAPT：多台内网主机共用一个公网地址</text>
<rect id="node-3" data-svg-box="" x="768" y="212" width="584" height="140" rx="14" fill="#ffffff" stroke="#e0b48f" stroke-width="2"/>
<text x="788" y="253" font-size="22" font-weight="700" fill="#24282f" data-svg-container="node-3">NAPT 映射表（示例）</text>
<text x="788" y="291" font-size="22" fill="#24282f" data-svg-container="node-3">192.168.1.10:5000 ↔ 203.0.113.5:60001</text>
<text x="788" y="329" font-size="22" fill="#24282f" data-svg-container="node-3">192.168.1.11:5000 ↔ 203.0.113.5:60002</text>
<text x="768" y="410" font-size="23" fill="#24282f" data-svg-container="node-2">SNAT：出公网时改写源地址与源端口</text>
<text x="768" y="449" font-size="23" fill="#24282f" data-svg-container="node-2">DNAT：公网地址的某个端口映射到内网服务器</text>
<text x="768" y="492" font-size="22" fill="#5c626b" data-svg-container="node-2">代价：外网无法主动连入，需补 DNAT 规则</text>
<text x="768" y="530" font-size="22" fill="#5c626b" data-svg-container="node-2">一个公网地址仅六万多个端口；端到端直连被打破</text>
<text x="768" y="569" font-size="22" fill="#5c626b" data-svg-container="node-2">两个 NAT 后的设备互连需要打洞</text>
<text x="768" y="607" font-size="22" fill="#5c626b" data-svg-container="node-2">路由器 WAN 口拿到的可能就是运营商内网地址（CGNAT）</text>
<rect id="node-4" data-svg-box="" x="60" y="654" width="1320" height="264" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="88" y="699" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-4">尺寸约束：MTU 1500 与 MSS 1460</text>
<rect id="node-5" data-svg-box="" x="88" y="724" width="160" height="62" rx="8" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="168.0" y="763" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-5">IP 头 20B</text>
<rect id="node-6" data-svg-box="" x="248" y="724" width="160" height="62" rx="8" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="328.0" y="763" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-6">TCP 头 20B</text>
<rect id="node-7" data-svg-box="" x="408" y="724" width="840" height="62" rx="8" fill="#ffffff" stroke="#c3b4d6" stroke-width="2"/>
<text x="828.0" y="763" font-size="22" fill="#24282f" text-anchor="middle" data-svg-container="node-7">数据 = MSS 1460</text>
<text x="88" y="818" font-size="22" fill="#5c626b" data-svg-container="node-4">MSS 由双方各自通告、发送不超过对方通告值：1500 − 20（IP 头）− 20（TCP 头）= 1460</text>
<text x="88" y="856" font-size="22" fill="#5c626b" data-svg-container="node-4">中间设备可用 MSS Clamping 把通告值压小以适应隧道；超 MTU 的 IPv4 包在网络层分片，任一片丢失整包重传</text>
<text x="88" y="894" font-size="22" fill="#5c626b" data-svg-container="node-4">工程上用 PMTUD：发大包并置不分片位，沿途设备回 ICMP 通告自己的 MTU，发送方据此调整</text>
<rect id="node-8" data-svg-box="" x="60" y="940" width="1320" height="188" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="88" y="985" font-size="26" font-weight="700" fill="#24282f" data-svg-container="node-8">IPv6：128 位地址是最终解法，但迁移慢</text>
<text x="88" y="1025" font-size="23" fill="#24282f" data-svg-container="node-8">与 IPv4 协议层互不兼容，靠双栈并行与隧道过渡；地址解析用 NDP 而非 ARP</text>
<text x="88" y="1065" font-size="23" fill="#24282f" data-svg-container="node-8">普及慢：NAT 缓解了紧迫性、系统设备应用都要双栈、URL 方括号等细节抬高成本</text>
<text x="88" y="1104" font-size="22" fill="#5c626b" data-svg-container="node-8">NAT 只是地址转换，不能当防火墙依赖；IPv6 分片全由源端负责，巨型帧约 9000 仅机房内可用</text>
</g>
</svg>
