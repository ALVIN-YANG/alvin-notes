<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 890" role="img" aria-labelledby="t">
<title id="t">HTTP 报文模型与状态码</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97745"/></marker></defs>
<rect width="1440" height="890" fill="#fbfaf6"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#24282f">
<text x="60" y="68" font-size="38" font-weight="700" data-svg-label="">HTTP 报文模型与状态码</text>
<text x="60" y="112" font-size="23" fill="#5f6672" data-svg-label="">一问一答的报文结构、五类状态码与排障分工</text>
<rect id="node-1" data-svg-box="" x="60" y="150" width="560" height="260" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="78" y="194" font-size="24" font-weight="700" data-svg-container="node-1">请求报文</text>
<text x="78" y="232" font-size="22" data-svg-container="node-1">请求行：GET /index.html HTTP/1.1</text>
<text x="78" y="268" font-size="22" data-svg-container="node-1">请求头：Host、Cookie、Accept……</text>
<text x="78" y="304" font-size="22" data-svg-container="node-1">空行</text>
<text x="78" y="340" font-size="22" data-svg-container="node-1">请求体（可选）：表单或 JSON</text>
<rect id="node-2" data-svg-box="" x="820" y="150" width="560" height="260" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="838" y="194" font-size="24" font-weight="700" data-svg-container="node-2">响应报文</text>
<text x="838" y="232" font-size="22" data-svg-container="node-2">状态行：HTTP/1.1 200 OK</text>
<text x="838" y="268" font-size="22" data-svg-container="node-2">响应头：Content-Type、Set-Cookie……</text>
<text x="838" y="304" font-size="22" data-svg-container="node-2">空行</text>
<text x="838" y="340" font-size="22" data-svg-container="node-2">响应体：HTML、JSON、图片……</text>
<line x1="624" y1="230" x2="816" y2="230" stroke="#d97745" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<text x="720" y="218" font-size="22" fill="#5f6672" text-anchor="middle" data-svg-label="">请求</text>
<line x1="816" y1="320" x2="624" y2="320" stroke="#d97745" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<text x="720" y="308" font-size="22" fill="#5f6672" text-anchor="middle" data-svg-label="">响应</text>
<rect id="node-3" data-svg-box="" x="60" y="470" width="248" height="210" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="78" y="514" font-size="24" font-weight="700" data-svg-container="node-3">1xx 信息</text>
<text x="78" y="552" font-size="20" data-svg-container="node-3">100 Continue</text>
<text x="78" y="580" font-size="20" data-svg-container="node-3">请求已收到，继续发</text>
<rect id="node-4" data-svg-box="" x="328" y="470" width="248" height="210" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="346" y="514" font-size="24" font-weight="700" data-svg-container="node-4">2xx 成功</text>
<text x="346" y="552" font-size="20" data-svg-container="node-4">200 成功</text>
<text x="346" y="580" font-size="20" data-svg-container="node-4">204 无返回体</text>
<text x="346" y="608" font-size="20" data-svg-container="node-4">206 分片内容</text>
<rect id="node-5" data-svg-box="" x="596" y="470" width="248" height="210" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="614" y="514" font-size="24" font-weight="700" data-svg-container="node-5">3xx 重定向</text>
<text x="614" y="552" font-size="20" data-svg-container="node-5">301 永久、可缓存</text>
<text x="614" y="580" font-size="20" data-svg-container="node-5">302 临时重定向</text>
<text x="614" y="608" font-size="20" data-svg-container="node-5">304 缓存协商</text>
<text x="614" y="636" font-size="20" data-svg-container="node-5">（不是跳转）</text>
<rect id="node-6" data-svg-box="" x="864" y="470" width="248" height="224" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="882" y="514" font-size="24" font-weight="700" data-svg-container="node-6">4xx 查请求</text>
<text x="882" y="552" font-size="20" data-svg-container="node-6">400 参数错</text>
<text x="882" y="580" font-size="20" data-svg-container="node-6">403 无权限</text>
<text x="882" y="608" font-size="20" data-svg-container="node-6">404 不存在</text>
<text x="882" y="636" font-size="20" data-svg-container="node-6">405 方法不允许</text>
<text x="882" y="664" font-size="20" data-svg-container="node-6">429 限流</text>
<rect id="node-7" data-svg-box="" x="1132" y="470" width="248" height="210" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="1150" y="514" font-size="24" font-weight="700" data-svg-container="node-7">5xx 查后端</text>
<text x="1150" y="552" font-size="20" data-svg-container="node-7">500 内部错误</text>
<text x="1150" y="580" font-size="20" data-svg-container="node-7">502 网关无效响应</text>
<text x="1150" y="608" font-size="20" data-svg-container="node-7">503 过载</text>
<text x="1150" y="636" font-size="20" data-svg-container="node-7">504 网关超时</text>
<rect id="node-8" data-svg-box="" x="60" y="720" width="1320" height="110" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="720.0" y="766.4" font-size="22" text-anchor="middle" data-svg-container="node-8">排障分工：4xx 查请求、5xx 查后端；方法表动作、路径表对象、状态码表结果</text>
<text x="720.0" y="799.4" font-size="22" text-anchor="middle" data-svg-container="node-8">一个网页背后是 HTML + CSS + JS + 图片的多次请求响应</text>
</g></svg>
