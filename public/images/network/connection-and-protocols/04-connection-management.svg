<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1070" role="img" aria-labelledby="t">
<title id="t">连接管理的工程现实：长短连接、Keepalive 与 RST</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97745"/></marker></defs>
<rect width="1440" height="1070" fill="#fbfaf6"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#24282f">
<text x="60" y="68" font-size="38" font-weight="700" data-svg-label="">连接管理的工程现实：长短连接、Keepalive 与 RST</text>
<text x="60" y="112" font-size="23" fill="#5f6672" data-svg-label="">复用的四个坑、两层保活机制、RST 三个成因与服务器容量四道关</text>
<rect id="node-1" data-svg-box="" x="60" y="150" width="640" height="280" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="78" y="194" font-size="26" font-weight="700" data-svg-container="node-1">长连接：建一次复用多次</text>
<text x="78" y="232" font-size="23" data-svg-container="node-1">靠连接池统一管理；HTTP/1.1 起持久连接是默认</text>
<text x="78" y="266" font-size="23" data-svg-container="node-1">坑 1：NAT / 防火墙清会话表 → 复用时收 RST</text>
<text x="78" y="300" font-size="23" data-svg-container="node-1">坑 2：连接泄漏耗尽文件句柄</text>
<text x="78" y="334" font-size="23" data-svg-container="node-1">坑 3：服务端重启，客户端残留死连接</text>
<text x="78" y="368" font-size="23" data-svg-container="node-1">坑 4：心跳太频浪费带宽，太慢剔不出死连接</text>
<rect id="node-2" data-svg-box="" x="740" y="150" width="640" height="280" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="758" y="194" font-size="26" font-weight="700" data-svg-container="node-2">短连接：一次请求一条连接</text>
<text x="758" y="232" font-size="23" data-svg-container="node-2">用完四次挥手即关，无复用状态</text>
<text x="758" y="266" font-size="23" data-svg-container="node-2">天然避开长连接的四个坑</text>
<text x="758" y="300" font-size="23" data-svg-container="node-2">但每次重建都有握手与挥手开销</text>
<text x="758" y="334" font-size="23" data-svg-container="node-2">高频短连接下 TIME_WAIT 堆积成容量问题</text>
<rect id="node-3" data-svg-box="" x="60" y="470" width="640" height="310" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="78" y="514" font-size="26" font-weight="700" data-svg-container="node-3">Keepalive 有两层，别混淆</text>
<text x="78" y="552" font-size="23" data-svg-container="node-3">TCP Keepalive：内核级探测，判断对端是否活着</text>
<text x="78" y="586" font-size="23" data-svg-container="node-3">Linux 默认空闲约 7200 秒才开始探测</text>
<text x="78" y="620" font-size="23" data-svg-container="node-3">HTTP Keep-Alive：应用层的连接复用</text>
<text x="78" y="654" font-size="23" data-svg-container="node-3">拔网线 TCP 不立刻报错：没有报文交互就没有失败信号</text>
<text x="78" y="688" font-size="23" data-svg-container="node-3">只能靠重传超时或 keepalive 在数十秒到数小时后发现</text>
<text x="78" y="722" font-size="23" data-svg-container="node-3">经验法则：应用读写超时 &lt; 中间设备空闲清理时间</text>
<text x="78" y="756" font-size="23" data-svg-container="node-3">否则永远在复用一条已被静默回收的连接</text>
<rect id="node-4" data-svg-box="" x="740" y="470" width="640" height="310" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="758" y="514" font-size="26" font-weight="700" data-svg-container="node-4">RST：强制断连，数据可能被丢弃</text>
<text x="758" y="552" font-size="23" data-svg-container="node-4">三个最常见成因：</text>
<text x="758" y="586" font-size="23" data-svg-container="node-4">① 访问没有进程监听的端口</text>
<text x="758" y="620" font-size="23" data-svg-container="node-4">② 空闲连接被中间设备清理后再发数据</text>
<text x="758" y="654" font-size="23" data-svg-container="node-4">③ 服务端重启丢失连接状态</text>
<text x="758" y="688" font-size="23" data-svg-container="node-4">排查：先抓包确定谁发的，再查进程 / 超时 / 代码</text>
<rect id="node-5" data-svg-box="" x="60" y="820" width="1320" height="210" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="78" y="864" font-size="26" font-weight="700" data-svg-container="node-5">服务器能扛多少连接？</text>
<text x="78" y="900" font-size="22" data-svg-container="node-5">65535 限制的是单个客户端对单一目标的源端口数，不是服务器连接上限</text>
<text x="78" y="930" font-size="22" data-svg-container="node-5">服务器一个端口可服务大量四元组不同的连接</text>
<text x="78" y="960" font-size="22" data-svg-container="node-5">真实瓶颈：文件描述符上限、每连接内存（内核缓冲区 KB 级）、CPU 收发包、内核参数</text>
<text x="78" y="990" font-size="22" data-svg-container="node-5">默认配置几千连接；配合 epoll 与调优可到百万级（C10M 场景）</text>
</g></svg>