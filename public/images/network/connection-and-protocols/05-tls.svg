<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 910" role="img" aria-labelledby="t">
<title id="t">HTTPS 与 TLS 1.3：把不可信信道变成可信信道</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97745"/></marker></defs>
<rect width="1440" height="910" fill="#fbfaf6"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#24282f">
<text x="60" y="68" font-size="38" font-weight="700" data-svg-label="">HTTPS 与 TLS 1.3：把不可信信道变成可信信道</text>
<text x="60" y="112" font-size="23" fill="#5f6672" data-svg-label="">被攻击倒逼出的混合加密与 CA 证书链，以及 1-RTT、全加密与前向安全</text>
<rect id="node-1" data-svg-box="" x="60" y="150" width="300" height="180" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="78" y="192" font-size="24" font-weight="700" data-svg-container="node-1">对称加密</text>
<text x="78" y="228" font-size="22" data-svg-container="node-1">快，但密钥也要经</text>
<text x="78" y="258" font-size="22" data-svg-container="node-1">过不可信信道分发</text>
<text x="78" y="288" font-size="22" data-svg-container="node-1">——形成死结</text>
<line x1="364" y1="240" x2="416" y2="240" stroke="#d97745" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect id="node-2" data-svg-box="" x="420" y="150" width="300" height="180" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="438" y="192" font-size="24" font-weight="700" data-svg-container="node-2">非对称加密</text>
<text x="438" y="228" font-size="22" data-svg-container="node-2">公钥可公开，但慢</text>
<text x="438" y="258" font-size="22" data-svg-container="node-2">且只能解决单向</text>
<text x="438" y="288" font-size="22" data-svg-container="node-2">加密问题</text>
<line x1="724" y1="240" x2="776" y2="240" stroke="#d97745" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect id="node-3" data-svg-box="" x="780" y="150" width="280" height="180" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="798" y="192" font-size="24" font-weight="700" data-svg-container="node-3">混合加密</text>
<text x="798" y="228" font-size="22" data-svg-container="node-3">用非对称手段护送</text>
<text x="798" y="258" font-size="22" data-svg-container="node-3">对称会话密钥</text>
<text x="798" y="288" font-size="22" data-svg-container="node-3">之后全走对称加密</text>
<line x1="1064" y1="240" x2="1116" y2="240" stroke="#d97745" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect id="node-4" data-svg-box="" x="1120" y="150" width="260" height="180" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="1138" y="192" font-size="24" font-weight="700" data-svg-container="node-4">CA 证书链</text>
<text x="1138" y="228" font-size="22" data-svg-container="node-4">公钥可能被调包</text>
<text x="1138" y="258" font-size="22" data-svg-container="node-4">CA 私钥签名公钥信息</text>
<text x="1138" y="288" font-size="22" data-svg-container="node-4">根证书沿链验签</text>
<rect id="node-5" data-svg-box="" x="60" y="400" width="640" height="320" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="78" y="444" font-size="26" font-weight="700" data-svg-container="node-5">TLS 1.3（RFC 8446）的三件事</text>
<text x="78" y="482" font-size="23" data-svg-container="node-5">瘦身：只留 AEAD 套件，移除 RC4/DES/CBC、</text>
<text x="78" y="516" font-size="23" data-svg-container="node-5">MD5/SHA-1 与 RSA 静态密钥交换</text>
<text x="78" y="550" font-size="23" data-svg-container="node-5">提速：协商材料随 ClientHello 携带，1-RTT 完成握手</text>
<text x="78" y="584" font-size="23" data-svg-container="node-5">ServerHello 之后全部加密</text>
<text x="78" y="618" font-size="23" data-svg-container="node-5">安全：ECDHE 临时密钥（推荐 X25519），每次会话独立</text>
<text x="78" y="652" font-size="23" data-svg-container="node-5">拿到长期私钥也解不开历史流量＝前向安全</text>
<text x="78" y="686" font-size="23" data-svg-container="node-5">会话密钥由 HKDF 从多个随机源派生</text>
<rect id="node-6" data-svg-box="" x="740" y="400" width="640" height="320" rx="14" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="758" y="444" font-size="26" font-weight="700" data-svg-container="node-6">会话恢复：PSK 与 0-RTT</text>
<text x="758" y="482" font-size="23" data-svg-container="node-6">不是不握手，而是握手同时携带 early data</text>
<text x="758" y="516" font-size="23" data-svg-container="node-6">0-RTT 数据可被重放 → 只能用于幂等请求</text>
<text x="758" y="550" font-size="23" data-svg-container="node-6">并配合时间戳或随机数校验</text>
<text x="758" y="584" font-size="23" font-weight="700" data-svg-container="node-6">设计逻辑回顾：</text>
<text x="758" y="618" font-size="23" data-svg-container="node-6">对称快但密钥分发是死结 → 非对称护送会话密钥</text>
<text x="758" y="652" font-size="23" data-svg-container="node-6">公钥可能被调包且双方无感 → CA 签名 + 证书链验签</text>
<text x="758" y="686" font-size="23" data-svg-container="node-6">伪造者盖不出 CA 的章</text>
<rect id="node-7" data-svg-box="" x="60" y="760" width="1320" height="110" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="720.0" y="806.2" font-size="22" text-anchor="middle" data-svg-container="node-7">HTTPS = HTTP over TLS：加密、完整性、身份认证三件套</text>
<text x="720.0" y="839.2" font-size="22" text-anchor="middle" data-svg-container="node-7">TLS 1.3 的三件事：瘦身（只留 AEAD）、提速（1-RTT）、安全（前向安全）</text>
</g></svg>