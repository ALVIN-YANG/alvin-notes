<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" role="img" aria-labelledby="t">
<title id="t">流量控制与拥塞控制：保护接收方，也保护网络</title>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d97745"/></marker></defs>
<rect width="1440" height="1020" fill="#fbfaf6"/>
<g font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" fill="#24282f">
<text x="60" y="68" font-size="38" font-weight="700" data-svg-label="">流量控制与拥塞控制：保护接收方，也保护网络</text>
<text x="60" y="112" font-size="23" fill="#5f6672" data-svg-label="">接收窗口随 ACK 右滑与零窗口探测；Reno / CUBIC / BBR 三种窗口演化</text>
<rect id="node-1" data-svg-box="" x="380" y="150" width="680" height="72" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="720.0" y="194.05" font-size="23" font-weight="700" text-anchor="middle" data-svg-container="node-1">实际发送上限 = min（接收窗口 rwnd，拥塞窗口 cwnd）</text>
<rect id="node-2" data-svg-box="" x="60" y="240" width="640" height="360" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="78" y="284" font-size="26" font-weight="700" data-svg-container="node-2">流量控制：发送窗口随 ACK 右滑</text>
<rect id="node-3" data-svg-box="" x="78" y="316" width="142" height="60" rx="10" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="149" y="354" font-size="20" font-weight="700" text-anchor="middle" data-svg-container="node-3">已确认</text>
<rect id="node-4" data-svg-box="" x="228" y="316" width="142" height="60" rx="10" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="299" y="354" font-size="20" font-weight="700" text-anchor="middle" data-svg-container="node-4">已发未确认</text>
<rect id="node-5" data-svg-box="" x="378" y="316" width="142" height="60" rx="10" fill="#f9ecdf" stroke="#e0b48f" stroke-width="2"/>
<text x="449" y="354" font-size="20" font-weight="700" text-anchor="middle" data-svg-container="node-5">可发送</text>
<rect id="node-6" data-svg-box="" x="528" y="316" width="142" height="60" rx="10" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="599" y="354" font-size="20" font-weight="700" text-anchor="middle" data-svg-container="node-6">不可发送</text>
<text x="78" y="424" font-size="23" data-svg-container="node-2">接收方在每个 ACK 里携带接收窗口（缓冲区剩余）</text>
<text x="78" y="458" font-size="23" data-svg-container="node-2">缓冲区满 → 通告零窗口，发送方停发</text>
<text x="78" y="492" font-size="23" data-svg-container="node-2">持续计时器定期发零窗口探测，防双方互等死锁</text>
<text x="78" y="526" font-size="23" data-svg-container="node-2">糊涂窗口综合症：每次只读几字节 → 小包塞满网络</text>
<text x="78" y="560" font-size="23" data-svg-container="node-2">解法：接收方攒够空间再通告，发送方凑够再发</text>
<rect id="node-7" data-svg-box="" x="60" y="620" width="640" height="240" rx="14" fill="#efe9f4" stroke="#c3b4d6" stroke-width="2"/>
<text x="78" y="664" font-size="26" font-weight="700" data-svg-container="node-7">实践选型</text>
<text x="78" y="702" font-size="23" data-svg-container="node-7">有线数据中心常用 CUBIC</text>
<text x="78" y="736" font-size="23" data-svg-container="node-7">无线移动场景倾向 BBR</text>
<text x="78" y="770" font-size="23" data-svg-container="node-7">拥塞控制保护中间网络：路由器缓冲区填满就丢包</text>
<text x="78" y="804" font-size="23" data-svg-container="node-7">平衡带宽利用率、排队延迟与丢包三者关系</text>
<rect id="node-8" data-svg-box="" x="740" y="240" width="640" height="170" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="758" y="284" font-size="26" font-weight="700" data-svg-container="node-8">Reno：丢包驱动</text>
<text x="758" y="320" font-size="23" data-svg-container="node-8">慢启动指数增长 → 到阈值后线性增长</text>
<text x="758" y="352" font-size="23" data-svg-container="node-8">丢包触发快重传与快恢复，窗口减半</text>
<text x="758" y="384" font-size="23" data-svg-container="node-8">高带宽下随机丢包就减半，浪费严重</text>
<rect id="node-9" data-svg-box="" x="740" y="430" width="640" height="170" rx="14" fill="#e7edf3" stroke="#b9c6d4" stroke-width="2"/>
<text x="758" y="474" font-size="26" font-weight="700" data-svg-container="node-9">CUBIC：Linux 默认</text>
<text x="758" y="510" font-size="23" data-svg-container="node-9">记录丢包时的最大窗口 Wmax</text>
<text x="758" y="542" font-size="23" data-svg-container="node-9">三次函数：先平缓逼近、再加速越过</text>
<text x="758" y="574" font-size="23" data-svg-container="node-9">仍是丢包驱动，无线随机丢包照样误降速</text>
<rect id="node-10" data-svg-box="" x="740" y="620" width="640" height="240" rx="14" fill="#e4ecdf" stroke="#a9c0a4" stroke-width="2"/>
<text x="758" y="664" font-size="26" font-weight="700" data-svg-container="node-10">BBR：模型驱动</text>
<text x="758" y="700" font-size="23" data-svg-container="node-10">丢包只触发重传，不参与速率决策</text>
<text x="758" y="732" font-size="23" data-svg-container="node-10">持续采样瓶颈带宽与最小 RTT 建模</text>
<text x="758" y="764" font-size="23" data-svg-container="node-10">Startup → Drain → ProbeBW → ProbeRTT 四阶段</text>
<text x="758" y="796" font-size="23" data-svg-container="node-10">Wi-Fi / 4G/5G 随机丢包链路表现更好</text>
<text x="758" y="828" font-size="23" data-svg-container="node-10">短板：与 CUBIC 共存的公平性，探测期瞬时排队波动</text>
<rect id="node-11" data-svg-box="" x="60" y="900" width="1320" height="80" rx="14" fill="#fffef9" stroke="#c9c2b2" stroke-width="2"/>
<text x="720.0" y="947.7" font-size="22" text-anchor="middle" data-svg-container="node-11">流量控制看接收方缓冲区，拥塞控制看网络状况——两套窗口独立演化，发送时取小</text>
</g></svg>